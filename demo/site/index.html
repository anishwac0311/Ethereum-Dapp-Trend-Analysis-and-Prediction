<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethereum DApp Trends</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&family=Outfit:wght@400;500;600&family=Bebas+Neue&family=Inter:wght@300..600&display=swap" rel="stylesheet">
<style>
/* Four themes from the palette board. Each: surfaces, ink, two quiet colours + one loud, and a font pair.
   Default "indigo" echoes Ethereum's own blue-violet. Switch with ?theme=navy|green|amber or Shift+T. */
:root,[data-theme=indigo]{
  --desk:#EEF2F8; --paper:#FFFFFF; --ink:#050816; --ink-2:#3B4256; --muted:#7A8199; --rule:#E2E7F0; --wash:#F3F5FA;
  --q1:#64748B; --q1-soft:#DCE2EC; --q2:#B4BBCD; --loud:#6467F2; --loud-ink:#4B4ED8; --loud-soft:#E4E5FD; --on-loud:#FFFFFF;
  --title:"Newsreader",Georgia,serif; --body:"Plus Jakarta Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --title-weight:400; --title-case:none; --title-track:-.015em;
}
/* "ink" (default): private-bank calm, after the Mercury DESIGN.md reference — a night nav band over a near-white
   canvas, cards lifted by fill not borders, one solid indigo action, light type weights, capsule controls. */
/* "cream" (default): warm editorial annual-report feel, after the Mastercard DESIGN.md reference —
   putty-cream canvas, warm near-black ink pills for actions, one font (Sofia Sans) at 450/500 with -2% headline
   tracking, radii of 20px (buttons), 40px (big containers) or full pill, soft 48px-spread shadows, ink footer.
   Orange is an attention cue only: "you", "now" and the key number. The logo red/yellow are never used. */
[data-theme=cream]{
  --desk:#F3F0EE; --paper:#FCFBFA; --ink:#141413; --ink-2:#4A4846; --muted:#696969; --rule:#DED9D3; --wash:#EAE5DF;
  --q1:#5E5C59; --q1-soft:#E3DED8; --q2:#C9C3BB; --loud:#F37338; --loud-ink:#CF4500; --loud-soft:#F8E3D7; --on-loud:#FFFFFF;
  --title:"Sofia Sans",Arial,sans-serif; --body:"Sofia Sans",Arial,sans-serif; --mono:"Sofia Sans",Arial,sans-serif;
  --title-weight:500; --title-case:none; --title-track:-.02em;
  --nav-bg:#FFFFFF; --nav-ink:#141413; --nav-muted:#696969; --nav-rule:#DED9D3; --nav-done:#5E5C59;
  --foot-bg:#141413; --foot-ink:rgba(243,240,238,.72);
  --cta-bg:#141413; --cta-ink:#F3F0EE;
  --w-body:450; --w-ui:500; --w-strong:700; --lbl-track:.04em; --lbl-size:13px;
  --slide-shadow:0 24px 48px rgba(0,0,0,.06);
}
/* "study" (default): the research-paper look shared by every page: paper canvas, ink lines, warm grey for
   the comparison, rust for "you / now", Newsreader titles, JetBrains Mono labels, square panels. */
[data-theme=study]{
  --desk:#F5F3EE; --paper:#FBFAF7; --ink:#1A1A1A; --ink-2:#5A5650; --muted:#8E8A82; --rule:#DDD8CF; --wash:#EFECE6;
  --q1:#1A1A1A; --q1-soft:#E2DDD4; --q2:#A39E95; --loud:#9C4A26; --loud-ink:#9C4A26; --loud-soft:#F1E4DC; --on-loud:#FFFFFF;
  --ref:#1A1A1A; --event:#9C4A26; --band:#E2DDD4;
  --title:"Newsreader",Georgia,serif; --body:"Plus Jakarta Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --title-weight:400; --title-case:none; --title-track:-.01em;
  --nav-bg:#F5F3EE; --nav-ink:#1A1A1A; --nav-muted:#8E8A82; --nav-rule:#DDD8CF; --nav-done:#1A1A1A;
  --foot-bg:#F5F3EE; --foot-ink:#8E8A82; --cta-bg:#1A1A1A; --cta-ink:#F5F3EE;
  --w-body:400; --w-ui:500; --w-strong:500; --lbl-track:.14em; --lbl-size:11.5px; --slide-shadow:none;
}
[data-theme=ink]{
  --desk:#FBFCFD; --paper:#FFFFFF; --ink:#28253B; --ink-2:#554E7B; --muted:#8A85A6; --rule:#E7E5F2; --wash:#EDECFB;
  --q1:#7C7699; --q1-soft:#E4E2F0; --q2:#C3C3CC; --loud:#5266EB; --loud-ink:#4053D6; --loud-soft:#E9EBFC; --on-loud:#FFFFFF;
  --title:"Inter",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"Inter",system-ui,sans-serif;
  --title-weight:480; --title-case:none; --title-track:.01em;
  --nav-bg:#171721; --nav-ink:#EDEDF3; --nav-muted:#C3C3CC; --nav-rule:rgba(237,237,243,.16); --nav-done:#9CB4E8;
  --w-body:380; --w-ui:450; --w-strong:500; --lbl-track:.02em; --lbl-size:13.5px;
  --slide-shadow:0 1px 2px rgba(40,37,59,.04),0 8px 28px rgba(40,37,59,.06);
}
[data-theme=navy]{
  --desk:#0E1322; --paper:#161D30; --ink:#F8FAFC; --ink-2:#C3CBDB; --muted:#8792AA; --rule:#2A3349; --wash:#1D2539;
  --q1:#9AA6BF; --q1-soft:#2B3550; --q2:#56627E; --loud:#5B8EF7; --loud-ink:#7AA7F8; --loud-soft:#22345F; --on-loud:#FFFFFF;
  --title:"Space Grotesk",system-ui,sans-serif; --body:"Space Grotesk",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --title-weight:500; --title-case:none; --title-track:-.02em;
}
[data-theme=green]{
  --desk:#14382B; --paper:#1B4536; --ink:#EFFBF3; --ink-2:#C2E3D0; --muted:#86B39C; --rule:#2D5E4B; --wash:#21503F;
  --q1:#A9D3BD; --q1-soft:#2C5E4A; --q2:#5E8C76; --loud:#6BD6A0; --loud-ink:#8BE3B6; --loud-soft:#2A6A50; --on-loud:#0D2A1F;
  --title:"Outfit",system-ui,sans-serif; --body:"Outfit",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --title-weight:500; --title-case:none; --title-track:-.015em;
}
[data-theme=amber]{
  --desk:#10151F; --paper:#171E2B; --ink:#F8FAFC; --ink-2:#C8CFDB; --muted:#8B94A6; --rule:#2A3242; --wash:#1E2635;
  --q1:#A3ADBF; --q1-soft:#2B3446; --q2:#566177; --loud:#F2C14E; --loud-ink:#F5CF73; --loud-soft:#3E3522; --on-loud:#151B26;
  --title:"Bebas Neue",Impact,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --title-weight:400; --title-case:uppercase; --title-track:.01em;
}
/* defaults on html (lower specificity) so each [data-theme] block can override them */
html{--foot-bg:var(--nav-bg);--foot-ink:var(--nav-muted);--cta-bg:var(--loud);--cta-ink:var(--on-loud);--nav-bg:var(--desk);--nav-ink:var(--ink-2);--nav-muted:var(--muted);--nav-rule:var(--rule);--nav-done:var(--q1);--w-body:400;--w-ui:600;--w-strong:700;--lbl-track:.1em;--lbl-size:12.5px;--slide-shadow:0 0 0 1px var(--rule)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;font-weight:var(--w-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.85em}
.lbl{font-family:var(--mono);font-size:var(--lbl-size);letter-spacing:var(--lbl-track);font-weight:var(--w-strong);text-transform:uppercase;color:var(--muted)}
h1,h2{font-family:var(--title);font-weight:var(--title-weight);text-transform:var(--title-case);letter-spacing:var(--title-track);margin:0}
h1{font-size:clamp(44px,6.6vw,80px);line-height:1.04}
h2{font-size:clamp(32px,3.2vw,46px);line-height:1.1}
[data-theme=amber] h1{font-size:clamp(56px,8vw,104px)} [data-theme=amber] h2{font-size:clamp(42px,4.2vw,62px);line-height:.98}
.k{color:var(--loud);font-style:normal}
.tiny{font-size:15px;color:var(--muted)}

/* rounded controls */
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 22px;font-weight:var(--w-ui);font-size:16px;background:var(--cta-bg);color:var(--cta-ink)}
.pill:hover{filter:brightness(1.08)}
.pill.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--rule);font-weight:500}
.pill.ghost:hover{border-color:var(--ink-2);filter:none}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;padding:4px;background:var(--wash);border-radius:999px}
.seg button{padding:7px 15px;font-size:15px;color:var(--ink-2);border-radius:999px;white-space:nowrap}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:var(--w-strong);box-shadow:0 0 0 1px var(--rule)}
.seg button:not(.on):hover{color:var(--ink)}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--nav-bg)}
header.top .lbl{color:var(--nav-muted)}
.bar{max-width:1440px;margin:0 auto;padding:0 28px;min-height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.bar>:first-child{justify-self:start}
.bar>:last-child{justify-self:end}
.navlink{font-family:var(--mono);font-size:var(--lbl-size);letter-spacing:var(--lbl-track);font-weight:var(--w-strong);text-transform:uppercase;color:var(--nav-ink)}
.navlink:hover{color:var(--loud-ink)}
.progress{height:3px;background:var(--rule);max-width:1440px;margin:0 auto}
.progress i{display:block;height:100%;background:var(--loud);border-radius:0 3px 3px 0;transition:width .5s}

/* stage: one question per slide, words on the left, the chart on the right */
.steps{display:flex;gap:6px;max-width:1320px;margin:0 auto;padding:2px 28px 14px}
.steps button{flex:1;height:6px;border-radius:999px;background:var(--nav-rule)}
.steps button.done{background:var(--nav-done)}
.steps button.cur{background:var(--loud)}
.steps button:hover{background:var(--nav-muted)}
.stage{position:relative;max-width:1320px;margin:0 auto;padding:22px 28px 56px}
.slide{background:var(--paper);border-radius:24px;box-shadow:var(--slide-shadow);padding:44px 56px 36px;display:flex;flex-direction:column}
.slide-head h2{max-width:1100px}
.ask{font-size:17px;font-weight:var(--w-strong);color:var(--loud-ink);margin-bottom:16px}
.caption{font-size:20px;color:var(--ink-2);margin:16px 0 0}
.controls{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;margin-top:28px;padding-top:22px;border-top:1px solid var(--rule)}
.control{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.control .lbl{margin:0}
.picture{width:100%;margin:34px 0 0}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:40px}
.notes>div{background:var(--wash);border-radius:20px;padding:20px 24px}
.notes>div.careful{background:var(--loud-soft)}
.notes .lbl{display:block;margin-bottom:6px}
.notes p{margin:0;font-size:16.5px;color:var(--ink-2);line-height:1.55}
.chipread{display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;background:var(--loud-soft);color:var(--loud-ink);font-weight:var(--w-strong);font-size:15px;font-variant-numeric:tabular-nums}
.fig svg{width:100%;height:auto;display:block;overflow:visible}
.ax{font-family:var(--mono);font-size:12.5px;fill:var(--muted)}
.axl{font-family:var(--body);font-size:15px;font-weight:var(--w-strong)}
.readout{font-family:var(--title);font-size:26px;line-height:1.1}
[data-theme=amber] .readout{font-size:32px}
input[type=range].plain{width:100%;accent-color:var(--loud);margin:12px 0 4px}
.slider{margin-top:22px;max-width:980px}
.slider .row{display:flex;align-items:center;gap:12px}
.turn{position:absolute;top:50%;transform:translateY(-50%);z-index:8;width:52px;height:52px;border-radius:999px;background:var(--paper);box-shadow:0 0 0 1px var(--rule),0 6px 18px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--ink-2)}
.turn:hover,.turn:focus-visible{background:var(--loud);color:var(--on-loud);outline:none}
.turn.prev{left:4px} .turn.next{right:4px}

/* time track */
.track{margin-top:22px;max-width:980px}
.track .head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.tr{position:relative;padding:0 10px}
.tr-ev{position:relative;height:44px}
.tr-ev span{position:absolute;bottom:0;transform:translateX(-50%);text-align:center;white-space:nowrap;line-height:1.25}
.tr-ev b{display:block;font-weight:600;font-size:14px;color:var(--loud-ink)}
.tr-ev i{display:block;font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tr-ev span::after{content:"";display:block;width:2px;height:9px;background:var(--loud);margin:4px auto 0}
.tr-bar{display:flex;height:38px;gap:4px}
.tr-bar div{display:flex;align-items:center;padding:0 12px;font-size:13.5px;color:var(--muted);background:var(--wash);overflow:hidden;white-space:nowrap;border-radius:999px}
.tr-bar div.on{background:var(--q1-soft);color:var(--ink);font-weight:600}
.tr-yr{position:relative;height:22px;margin-top:6px}
.tr-yr span{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:12px;color:var(--muted)}
.tr input{position:absolute;left:0;right:0;top:44px;width:100%;height:38px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.tr input::-webkit-slider-runnable-track{height:38px;background:transparent}
.tr input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:8px;background:var(--loud);border:4px solid var(--paper);border-radius:50%;box-shadow:0 0 0 1px var(--loud)}
.tr input::-moz-range-thumb{width:14px;height:14px;background:var(--loud);border:4px solid var(--paper);border-radius:50%}
.tr input:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:999px}

/* home, pick, card, about */
.sheet{max-width:1240px;margin:0 auto;padding:64px 28px 90px}
.lede{color:var(--ink-2);font-size:20px;margin:20px 0 0;max-width:720px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:52px}
.door{text-align:left;background:var(--paper);border-radius:22px;padding:36px 36px 32px;display:flex;flex-direction:column;box-shadow:var(--slide-shadow);transition:box-shadow .2s}
.door:hover{box-shadow:0 0 0 2px var(--loud),var(--slide-shadow)}
.door p{color:var(--ink-2);margin:14px 0 0}
.door .foot{margin-top:auto;padding-top:26px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.glance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:22px;align-items:center;margin-top:30px;padding:22px 28px;border-radius:22px;background:var(--wash)}
.glance b{display:block;font-family:var(--title);font-weight:var(--title-weight);font-size:30px;line-height:1.1;color:var(--ink)}
.glance span{font-size:15px;color:var(--ink-2)}
.glance .more{font-weight:600;color:var(--loud-ink);white-space:nowrap}
.define{margin-top:36px;padding:30px 34px;border-radius:22px;background:var(--loud-soft)}
.define p{font-family:var(--title);font-size:clamp(22px,2.2vw,30px);line-height:1.35;margin:10px 0 12px}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:22px}
.group{background:var(--wash);border-radius:22px;padding:24px 26px}
.group h3{margin:0 0 8px;font-size:20px;font-weight:var(--w-strong)}
.group h3 span{font-weight:500;color:var(--muted)}
.group p{margin:0;color:var(--ink-2);font-size:16.5px}
.group.hi{background:var(--loud-soft)} .group.hi h3{color:var(--loud-ink)}
.rules{margin:22px 0 0;padding:20px 26px;border-radius:22px;box-shadow:0 0 0 1px var(--rule);color:var(--ink-2)}
.rules b{color:var(--ink)}
.panel{background:var(--paper);border-radius:22px;padding:34px 36px;box-shadow:var(--slide-shadow);margin-top:30px}
.list button{display:flex;width:100%;align-items:baseline;gap:14px;border-bottom:1px solid var(--rule);padding:14px 6px;text-align:left;border-radius:10px}
.list button:hover{background:var(--wash)}
.list .nm{font-size:19px;font-weight:var(--w-strong)}
.list .tag{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.list .date{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.search{width:100%;border:0;background:var(--wash);border-radius:999px;padding:14px 22px;font-size:18px;outline:none}
.search:focus{box-shadow:0 0 0 2px var(--loud)}
/* focus rings are ink: rust means success, so it never marks focus */
[data-theme=study] .search:focus,[data-theme=study] .form input:focus,[data-theme=study] .form select:focus,[data-theme=study] .filter select:focus-visible,[data-theme=study] .fpop select:focus-visible,[data-theme=study] details.paste textarea:focus{box-shadow:0 0 0 2px #1A1A1A}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.form label{display:block}
.form input,.form select{width:100%;border:0;background:var(--wash);border-radius:14px;padding:12px 16px;font-size:18px;outline:none;margin-top:8px}
.form input:focus,.form select:focus{box-shadow:0 0 0 2px var(--loud)}
.err{color:var(--loud-ink);font-size:16px;margin-top:12px;min-height:22px}
.textlink{color:var(--loud-ink);font-weight:600}
.card-row{display:grid;grid-template-columns:64px 1fr;gap:14px;border-top:1px solid var(--rule);padding:20px 0}
.card-row .q{font-family:var(--mono);font-size:12.5px;color:var(--loud-ink);padding-top:6px}
.card-row p{margin:0;font-size:21px;line-height:1.5}
.take{display:grid;grid-template-columns:150px 1fr;gap:30px;border-top:1px solid var(--rule);padding-top:26px;margin-top:10px;align-items:center}
.qr{width:150px;height:150px;border:1.5px dashed var(--muted);border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:12px}
.about dl{display:grid;grid-template-columns:170px 1fr;gap:18px 28px;margin:0}
.about dt{font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.about dd{margin:0}
.team{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 24px}
.team b{font-weight:500}
.team span{display:block;font-size:13.5px;color:var(--muted)}
.todo{background:#FFF1C2;color:#3A2E00;padding:0 6px;border-radius:6px}

/* secondary actions are tinted capsules; only one solid action per view */
.pill.tint{background:var(--loud-soft);color:var(--loud-ink)}
/* night footer frames every page and carries the disclaimer */
.site-foot{background:var(--foot-bg);color:var(--foot-ink);font-size:15px}
.fwrap{max-width:1264px;margin:0 auto;padding:72px 28px 40px}
.fhead{color:#fff!important;font-size:clamp(28px,3vw,40px)!important;max-width:760px;line-height:1.15}
.fcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin-top:44px}
.fh{display:block;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:10px}
.fcols p{margin:0;line-height:1.7;color:var(--foot-ink)}
.flink{color:#fff}
.flink:hover{text-decoration:underline}
.fbottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:56px;padding-top:20px;border-top:1px solid rgba(255,255,255,.18);font-size:13px;color:rgba(255,255,255,.55)}
.sat{display:none}
.ghost-word{display:none}
.hero .lede{max-width:520px}

/* ink theme follows the Mercury DESIGN.md spec: 12–16px cards, 32/40px capsules at 40px tall,
   translucent secondary pills, light weights, centred hero headline, night stat band */
[data-theme=ink] .bar{min-height:72px}
[data-theme=ink] .pill{height:40px;padding:0 20px;border-radius:32px;font-weight:420}
[data-theme=ink] .pill.tint{background:rgba(82,102,235,.1);color:var(--ink);border-radius:40px}
[data-theme=ink] .seg{background:none;padding:0;gap:8px}
[data-theme=ink] .seg button{height:40px;padding:0 20px;border-radius:40px;background:rgba(112,115,147,.1);color:var(--ink);font-size:15px;font-weight:420}

.toolbar .filter{height:50px;padding:0 10px 0 20px;gap:14px}

.toolbar .mt{width:320px;height:36px}
.toolbar .mt-ev i{top:0;font-size:11px}
.toolbar .mt-bar{top:22px}
.toolbar .mt input{top:14px}
.toolbar .filter.range input{width:170px}
.picture{margin-top:18px!important}

.headrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end}
.headrow .filters{display:flex;gap:8px;padding-bottom:4px}
.fl{position:relative}
.fchip{height:40px;padding:0 16px 0 18px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);display:inline-flex;align-items:center;gap:10px}
.fchip::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.fl:hover .fchip,.fl:focus-within .fchip{background:var(--ink);color:var(--desk);box-shadow:none}
.fl:hover .fchip::after,.fl:focus-within .fchip::after{transform:translateY(1px) rotate(225deg)}
.fpop{position:absolute;right:0;top:calc(100% + 10px);z-index:30;display:flex;align-items:center;gap:14px;white-space:nowrap;padding:14px 20px;border-radius:20px;background:#fff;box-shadow:0 24px 48px rgba(0,0,0,.12),0 0 0 1px var(--rule);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s,transform .18s,visibility 0s .18s}
.fpop::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px}
.fl:hover .fpop,.fl:focus-within .fpop{opacity:1;visibility:visible;transform:none;transition:opacity .18s,transform .18s}
.flbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.fpop select{border:0;background:var(--wash);font-weight:var(--w-ui);color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer;outline:none;font-size:15px}
.fpop select:focus-visible{box-shadow:0 0 0 2px var(--loud)}
.fpop input[type=range]{width:180px;accent-color:var(--loud)}
.fpop b{font-weight:var(--w-strong);font-variant-numeric:tabular-nums;min-width:72px;color:var(--loud-ink)}
.fpop .mt{position:relative;width:320px;height:36px}
.fpop .mt-ev i{position:absolute;top:0;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:700;color:var(--loud-ink)}
.fpop .mt-bar{position:absolute;left:0;right:0;top:22px;height:6px;display:flex;gap:2px}
.fpop .mt-bar em{display:block;height:100%;border-radius:999px;background:#D1CDC7}
.fpop .mt input{position:absolute;left:0;right:0;top:14px;width:100%;margin:0;height:22px;background:transparent;-webkit-appearance:none;appearance:none}
.fpop .mt input::-webkit-slider-runnable-track{height:22px;background:transparent}
.fpop .mt input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:3px;border-radius:50%;background:var(--loud);border:3px solid #fff;box-shadow:0 0 0 1px var(--loud)}
.picture{margin-top:30px!important}
[data-theme=navy] .fchip,[data-theme=green] .fchip,[data-theme=amber] .fchip,[data-theme=navy] .fpop,[data-theme=green] .fpop,[data-theme=amber] .fpop{background:var(--paper)}

/* one size for every figure */
.pane>.lbl{font-size:19px!important;font-weight:600!important;letter-spacing:-.01em!important;text-transform:none!important;color:var(--ink)!important}
.cbox:has(>.split){justify-content:flex-start}
.cbox .dlist{flex:1;display:flex;flex-direction:column;margin-top:14px}
.cbox .dlist li{flex:1;padding:0}
.mfig{height:210px;display:flex;flex-direction:column;justify-content:stretch}
.mfig>svg{width:100%;height:100%}
.mfig .hbars{height:100%;justify-content:space-between}
.mchart>.lbl{font-size:17px!important;font-weight:600!important;text-transform:none!important;letter-spacing:-.01em!important;color:var(--ink)!important}

[data-theme=amber] .slide{height:904px}

/* fixed header slots: question 1 line, title 2 lines, caption 2 lines, so every chart starts at the same height */
.slide-head .ask{height:22px;margin-bottom:14px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide-head h2{height:calc(2 * 1.06em);line-height:1.06!important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide-head .caption{height:calc(2 * 1.45em);line-height:1.45!important;margin-top:12px!important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.headrow{align-items:end;min-height:calc(2 * 1.06em)}
.headrow .filters{min-height:44px;align-self:start;padding-top:4px}

/* charts sit on the same two columns as the note cards below */
.duo{max-width:none!important;gap:16px!important;grid-template-columns:1fr 1fr!important}
.notes{grid-template-columns:1fr 1fr!important;gap:16px!important}
/* filters share the caption line, right-aligned */
.caprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start;margin-top:12px}
.caprow .caption{margin-top:0!important}
.caprow .filters{display:flex;gap:8px;justify-content:flex-end;padding-top:0}

.notes.one{grid-template-columns:1fr!important}
.notes.one>div{min-height:86px!important;display:flex;gap:18px;align-items:baseline;padding:18px 26px}
.notes.one .lbl{flex:none;margin:0!important}
.notes.one p{font-size:17px}

/* hierarchy, per the reference: dot + uppercase is only for eyebrows (the question, card labels);
   a chart's title is a card title (H3: sentence case, weight 500, -2% tracking, no dot) */
.pane>.lbl,.mchart>.lbl{font-size:21px!important;font-weight:500!important;letter-spacing:-.02em!important;text-transform:none!important;color:var(--ink)!important;line-height:1.2}
.pane>.lbl::before,.mchart>.lbl::before{content:none!important;display:none!important}
[data-theme=cream] .notes .lbl::before{background:#CF4500!important}

/* chart roles from the reference palette (cream):
   reference / market line = Link Blue, kept growing / successful = Charcoal, one-hit / others = Dust Taupe,
   you / now / the key number = Light Signal Orange, events (Terra, Dencun, 10K) = Clay Brown, bands = whisper cream */
html{--ref:var(--ink);--event:var(--loud);--band:var(--q1-soft)}
[data-theme=cream]{--ref:#141413;--event:#F37338;--band:#E8E2DA;--q1:#555555;--q2:#D1CDC7}
/* text colours from the reference palette, one per level:
   eyebrow (the question) Clay Brown + Signal Orange dot · title Ink · key number Signal Orange ·
   subtitle Granite · chart titles Charcoal · small labels Slate Gray · links Link Blue */
[data-theme=cream] .ask{color:#9A3A0A!important}
[data-theme=cream] .ask::before{background:#CF4500!important}
[data-theme=cream] .slide h2,[data-theme=cream] .sheet h1{color:#141413}
[data-theme=cream] .k{color:#CF4500}
[data-theme=cream] .slide-head .caption{color:#555555}
[data-theme=cream] .pane>.lbl,[data-theme=cream] .mchart>.lbl{color:#262627!important}
[data-theme=cream] .ax{fill:#696969}
[data-theme=cream] .fchip,[data-theme=cream] .flbl{color:#696969}
[data-theme=cream] .notes .careful .lbl{color:#9A3A0A!important}
[data-theme=cream] .notes .careful p{color:#262627}
[data-theme=cream] .sheet .lbl{color:#9A3A0A}
[data-theme=cream] .door .lbl{color:#9A3A0A}
[data-theme=cream] .door p,[data-theme=cream] .lede{color:#555555}

/* the six reference colours, each in the role the spec gives it (cream):
   Ink Black #141413 · CTAs, headlines, footer, eyebrow text
   Signal Orange #CF4500 · eyebrow dots and legal wording ("not investment advice")
   Light Signal Orange #F37338 · active indicators (current page, slider handles, open filter) and orbit arcs
   Clay Brown #9A3A0A · secondary link-style buttons ("What we measure →", "Next: …", "What counts as success?")
   Mastercard Red / Yellow · logo only, never used here */
.linkbtn{font-weight:600;color:var(--ink);border-bottom:1.5px solid currentColor;padding:2px 0;font-size:16px}
[data-theme=cream] .ask,[data-theme=cream] .sheet .lbl,[data-theme=cream] .door .lbl,[data-theme=cream] .notes .careful .lbl{color:#141413!important}
[data-theme=cream] .ask::before,[data-theme=cream] .sheet .lbl::before,[data-theme=cream] .slide .lbl::before{background:#CF4500!important}
[data-theme=cream] .linkbtn,[data-theme=cream] .textlink{color:#9A3A0A;font-weight:600;border-bottom:1.5px solid rgba(154,58,10,.35)}
[data-theme=cream] .linkbtn:hover,[data-theme=cream] .textlink:hover{border-bottom-color:#9A3A0A}
[data-theme=cream] .textlink::after{content:" →"}
[data-theme=cream] .glance .more.linkbtn{height:auto;padding:2px 0;border-radius:0;background:none;color:#9A3A0A;font-weight:600}
[data-theme=cream] .legal{color:#CF4500;font-weight:600}
[data-theme=cream] .site-foot .legal{color:#F37338}
[data-theme=cream] .fl:hover .fchip,[data-theme=cream] .fl:focus-within .fchip{background:#fff;color:#141413;box-shadow:inset 0 0 0 1.5px #F37338}
[data-theme=cream] .steps button.cur{background:#F37338}

.mcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:36px}
.mcard{text-align:left;padding:26px 28px 24px;border-radius:24px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);display:flex;flex-direction:column;gap:6px;transition:background .2s,box-shadow .2s}
.mcard:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.mcard .mct{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:8px}
.mcard .mct::before{content:none}
.mcard b{font-family:var(--title);font-weight:var(--title-weight);letter-spacing:var(--title-track);font-size:clamp(40px,4vw,56px);line-height:1.05;margin-top:10px}
.mcard b small{font-size:.5em;color:var(--muted);font-weight:var(--title-weight)}
.mcard .mcs{font-size:15px;color:var(--ink-2)}
.mcard.on{background:var(--ink);box-shadow:none}
.mcard.on .mct,.mcard.on b{color:var(--desk)}
.mcard.on b small,.mcard.on .mcs{color:rgba(243,240,238,.7)}
.mcard.on .mct::before{background:#F37338}
.mcards+.msec{margin-top:48px!important}
.mcards{margin-bottom:36px}

/* doors size to their content: no forced height, footer sits right under the text */
.door .foot{padding-top:28px!important}

.pchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pchip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px rgba(20,20,19,.2);font-size:15px;font-weight:450;color:var(--ink)}
.pchip em{font-style:normal;font-size:13px;color:var(--muted)}
.pchip:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.pchip.on{background:var(--ink);color:var(--desk);box-shadow:none}
.pchip.on em{color:rgba(243,240,238,.65)}
[data-theme=navy] .pchip,[data-theme=green] .pchip,[data-theme=amber] .pchip{background:var(--wash)}

/* footer: quieter headline */
.fhead{font-size:clamp(20px,1.8vw,26px)!important;max-width:620px}
.fwrap,[data-theme=cream] .fwrap{padding:56px 48px 36px!important}
.fcols{margin-top:32px!important}
.fbottom{margin-top:40px!important}
/* bigger stage: the slide grows with the window, charts keep their shape (560:380) and scale with their column,
   so every page lands at the same height without a fixed slide height */
.stage{max-width:1520px!important}
.slide,[data-theme=cream] .slide,[data-theme=amber] .slide{height:auto!important}
.pane{grid-template-rows:auto auto!important}
.cbox{height:auto!important;aspect-ratio:560/440}
.notes{margin-top:32px!important}
.progress,.steps{max-width:1520px!important}

/* home: use the same wide frame as the question pages, and scale the type with it */
.sheet.home{max-width:1520px!important;padding-left:28px;padding-right:28px}
[data-theme=cream] .hero{margin-top:84px}
[data-theme=cream] .hero h1{font-size:clamp(48px,5.4vw,84px)!important}
[data-theme=cream] .hero .lede{font-size:clamp(18px,1.4vw,22px)!important;max-width:560px}
.home .doors{gap:20px;margin-top:64px}
[data-theme=cream] .door{padding:48px 48px 40px!important}
[data-theme=cream] .door h2{font-size:clamp(30px,2.6vw,42px)!important;margin-top:22px}
[data-theme=cream] .door p{font-size:clamp(17px,1.25vw,20px)}
[data-theme=cream] .door .lbl{font-size:14px}
[data-theme=cream] .door .tiny{font-size:16px}
[data-theme=cream] .sat{width:64px;height:64px;font-size:24px}
[data-theme=cream] .glance{padding:44px 52px!important;margin-top:20px}
[data-theme=cream] .glance b{font-size:clamp(48px,4.6vw,72px)!important}
[data-theme=cream] .glance span{font-size:16px}
/* one width for nav, content and footer */
[data-theme=cream] .bar{max-width:1464px!important}
.fwrap{max-width:1464px!important}

/* diagnose */
.form .wide{grid-column:1/-1}
details.paste{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px}
details.paste summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
details.paste textarea{width:100%;margin-top:12px;border:0;border-radius:20px;padding:14px 18px;font:inherit;font-size:16px;background:#fff;box-shadow:inset 0 0 0 1px rgba(20,20,19,.3);resize:vertical;outline:none}
details.paste textarea:focus{box-shadow:inset 0 0 0 2px var(--loud)}
.dlist li span b{display:block;font-weight:600}
.dlist li span em{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.diag-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:24px}

/* hover */
.hov{fill:transparent;cursor:crosshair}
.hov:hover{fill:rgba(20,20,19,.045)}
.hovrow{cursor:default}
.hovbg{fill:transparent}
.hovrow:hover .hovbg{fill:rgba(20,20,19,.045)}
.cbox svg *:not(.hov):not(.hovbg){pointer-events:none}
.cbox svg .hov,.cbox svg .hovbg{pointer-events:all}
#tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;background:#141413;color:#F3F0EE;border-radius:14px;padding:10px 14px;font-size:13.5px;line-height:1.45;max-width:280px;box-shadow:0 12px 32px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:1px}
#tip.on{opacity:1;transform:none}
#tip b{font-weight:600;margin-bottom:3px}
#tip span{color:rgba(243,240,238,.82);font-variant-numeric:tabular-nums}

/* ===== the study (baseline pages): paper, serif headlines, mono labels, square panels ===== */
body.is-study{background:#F5F3EE}
body.is-study .orbits{display:none!important}
.s-wrap{max-width:1180px;margin:0 auto;padding:0 32px}

.s-time{display:grid;grid-template-columns:repeat(3,1fr);position:relative;margin-top:22px;padding-bottom:14px}

.s-hero1{grid-template-columns:minmax(0,1fr)!important}
.s-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:56px;align-items:start}
.s-hero h1{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(44px,5vw,68px);line-height:1.08;letter-spacing:-.01em;margin:0}

/* pick a live DApp: a river of names behind one big button */
.pk-lede{max-width:720px;font-size:17px;line-height:1.7;color:#5A5650;margin:-10px 0 28px}
.pk-stage{position:relative;height:440px;border-radius:28px;background:#FBFAF7;border:1px solid #E6E1D9;overflow:hidden}
.pk-river{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-around;padding:26px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.pk-lane{overflow:hidden;white-space:nowrap}
.pk-track{display:inline-flex;gap:44px;animation:pkflow linear infinite;will-change:transform}
.pk-lane.rev .pk-track{animation-direction:reverse}
.pk-lane:hover .pk-track{animation-play-state:paused}
@keyframes pkflow{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.pk-name{font-family:Newsreader,Georgia,serif;font-size:30px;color:#CFC9BF;background:none;padding:0;display:inline-flex;align-items:baseline;gap:8px;transition:color .15s}

.pk-name:hover{color:#141413}.pk-name:hover em{color:#CF4500}
.pk-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 40px));display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:30px 32px 24px;border-radius:28px;background:rgba(251,250,247,.94);box-shadow:0 24px 48px rgba(0,0,0,.08);border:1px solid #E6E1D9;text-align:center;z-index:2}
.pk-center>.s-mono{color:#8E8A82}

@keyframes pkpulse{50%{opacity:.25}}

.pk-rand:active{transform:scale(.98)}
.pk-search{position:relative;width:100%}
.pk-search .search{width:100%;padding:11px 18px!important;border:1px solid #DDD8CF;background:#F5F3EE;font-size:15px;text-align:center}
.pk-res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#FBFAF7;border:1px solid #E6E1D9;border-radius:20px;box-shadow:0 24px 48px rgba(0,0,0,.08);padding:6px;text-align:left;max-height:260px;overflow:auto;z-index:5}

.pk-hint{font-size:13px;color:#8E8A82}

/* =====================================================================
   Card system from DESIGN.md: lifted cream on canvas, hairline border,
   radius 20 (cards) / 28 (large frames) / pill (chips, inputs), no hard shadows.
   Floating things (menus, pop-ups) get the soft level-2 halo.
   ===================================================================== */
[data-theme=study]{--cd:#FBFAF7;--cl:#E6E1D9;--r1:20px;--r2:28px;--halo:0 24px 48px rgba(0,0,0,.08)}
[data-theme=study] .s-fig,[data-theme=study] .c-table,[data-theme=study] .s-table,[data-theme=study] .m-side,[data-theme=study] .s-wcard,
[data-theme=study] .example,[data-theme=study] .panel,[data-theme=study] .form,[data-theme=study] .verdict{
  background:var(--cd)!important;border:1px solid var(--cl)!important;border-radius:var(--r2)!important;box-shadow:none!important}
[data-theme=study] .t-card,[data-theme=study] .w-way,[data-theme=study] .w-era,[data-theme=study] .g-mode,[data-theme=study] .group,
[data-theme=study] .mchart,[data-theme=study] .mcard,[data-theme=study] .s-bridge,[data-theme=study] .g-over{
  border-radius:var(--r1)!important;box-shadow:none!important}
[data-theme=study] .t-card,[data-theme=study] .w-way,[data-theme=study] .group,[data-theme=study] .mchart,[data-theme=study] .mcard{background:var(--cd)!important;border:1px solid var(--cl)!important}
[data-theme=study] .s-bridge{border:1px solid var(--cl)!important;background:var(--cd)!important}
[data-theme=study] .w-era{border-color:var(--cl)}
[data-theme=study] .w-era.on{border-color:#CF4500}
[data-theme=study] .g-hero{border-color:var(--cl);border-radius:var(--r2)}
[data-theme=study] .g-start .g-lb{border-radius:var(--r2)}
[data-theme=study] .take{background:none!important;border:0!important;border-top:1px solid var(--cl)!important;border-radius:0!important;box-shadow:none!important}
[data-theme=study] .qr{border-radius:var(--r1)!important}
/* clickable cards lift a little on hover */
[data-theme=study] .s-cards{gap:16px}
[data-theme=study] .s-card{background:var(--cd);border:1px solid var(--cl)!important;border-radius:var(--r1);transition:box-shadow .2s,border-color .2s}
[data-theme=study] .s-card:hover,[data-theme=study] .w-way:hover,[data-theme=study] .g-mode:hover,[data-theme=study] .mcard:not(.on):hover{box-shadow:var(--halo)!important;border-color:#141413!important;background:var(--cd)!important}

<body>
<div id="orbits-host"></div>
<div id="app"></div>
<script src="data.js"></script>
<script>
const D = window.DEMO;
const CATS = D.meta.categories;
const THEMES = ["study","cream","ink","indigo","navy","green","amber"];
const PERIOD = {before:"Before Terra", between:"Terra → Dencun", after:"After Dencun"};
const PERIOD_IN = {before:"before Terra", between:"between Terra and Dencun", after:"after Dencun"};
const QNAME = {q1:"Categories", q2:"Survival", q3:"Concentration", q4:"Speed", q5:"Retention", q6:"Take-off"};
const PNAME = {q5:"Retention", q3:"Concentration", q1:"Categories", q2:"Survival", q3a:"Who holds the wallets", q3b:"A long tail", q4:"Speed", q5a:"Retention", q5b:"What predicts success", q6:"Take-off"};
const BOOKS = {
  s1:{pages:["q2","q4","q5","q6","q3","q1"], time:"The DApp's own time", title:"Your DApp"},
  s2:{pages:["q1","q3","q2","q5","q4"], time:"The market's time", title:"The market"},
};
let C = {};
function setTheme(t){
  if(!THEMES.includes(t)) t="study";
  document.documentElement.dataset.theme=t;
  const cs=getComputedStyle(document.documentElement), v=n=>cs.getPropertyValue(n).trim();
  C={ref:v("--ref")||v("--ink"), event:v("--event")||v("--loud"), band:v("--band")||v("--q1-soft"), ink:v("--ink"), ink2:v("--ink-2"), q1:v("--q1"), q1s:v("--q1-soft"), q2:v("--q2"), loud:v("--loud"), muted:v("--muted"), rule:v("--rule"), paper:v("--paper")};
}

const S = {view:"home", scen:null, idx:0, read:[], dapp:null, custom:null, cat:"DeFi", era:null, theme:"indigo",
           q1m:null, q3m:null, q3k:10, q4m:6, q6metric:"retention_prev_month", pickTab:"pick", query:"", from:"home"};

const $ = s => document.querySelector(s);
const pct = (x,d=0) => x==null ? "–" : (x*100).toFixed(d)+"%";
const sgn = (x,d=0) => x==null ? "–" : (x>0?"+":x<0?"−":"")+Math.abs(x*100).toFixed(d)+"%";
const fmtN = n => n==null ? "–" : n>=1e9 ? (n/1e9).toFixed(n>=1e10?0:1)+"B" : n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1)+"M" : n>=1e3 ? (n/1e3).toFixed(n>=1e4?0:1)+"K" : String(Math.round(n));
const comma = n => Math.round(n).toLocaleString("en-US");
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const monthLabel = m => { const [y,mm]=m.split("-"); return MON[+mm-1]+" "+y; };
const periodOf = m => m < D.meta.terra ? "before" : m < D.meta.dencun ? "between" : "after";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const K = s => `<em class="k">${s}</em>`;
const qOf = p => p.slice(0,2);

function me(){ return S.custom || (S.dapp ? {...D.dapps[S.dapp], slug:S.dapp} : null); }
function pages(){ return BOOKS[S.scen].pages; }
function era(){ const d=me(); return S.era || (d?d.period:"between"); }

/* ---------- chart helper ---------- */
/* phones: draw the 980-wide charts on a 560-wide canvas so their labels stay readable */
const PHONE=()=>innerWidth<=600;
function chart(o){
  if(S.theme==="study" && o.w===560){ o={...o,w:980,h:380,r:150};
    if(!o.log && o.yticks && o.yticks.length<=3){ const a=o.yticks[0], b=o.y[1], nice=raw=>{ const mag=10**Math.floor(Math.log10(raw)); return [1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw-1e-12); }, s4=nice((b-a)/4), st=(b-a)/s4>=3.5?s4:nice((b-a)/5);
      o.yticks=[...Array(6).keys()].map(i=>a+i*st).filter(t=>t<=b+1e-9); }
    o.marks=(o.marks||[]).map(k=>({...k,r:4}));
    o.series=(o.series||[]).map(se=>({...se,w:se.w>=2.5?2.5:se.w})); }
  if(S.theme==="study" && o.w===980) o.series=(o.series||[]).map(se=>({...se,w:se.w>=2.5?2.5:se.w}));
  const ph=PHONE() && o.w===980;
  if(ph) o={...o,w:560,h:Math.round((o.h||380)*1.1)+30,r:30}; /* phones: the line names sit on the lines, so the plot takes the full width */
  /* study theme, every screen: line names sit on their lines, so desktop drops the label column too */
  const onL=S.theme==="study"; if(onL&&!ph&&(o.series||[]).some(se=>se.label)) o={...o,r:36};
  if(ph && (o.xticks||[]).length>8) o={...o,xticks:o.xticks.filter((x,i)=>i%2===0)};
  const W=o.w||640, H=o.h||340, m={l:52,r:o.r||118,t:26,b:ph?74:44}, xty=ph?24:20;
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const ly = v => o.log ? Math.log10(Math.max(v,o.y[0])) : v;
  const y0=ly(o.y[0]), y1=ly(o.y[1]);
  const X = v => m.l + (v-o.x[0])/(o.x[1]-o.x[0])*iw;
  const Y = v => m.t + ih - (ly(v)-y0)/(y1-y0)*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet" role="img" aria-label="${esc(o.aria||"chart")}">`;
  (o.yticks||[]).forEach(t=>{ s+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(t)}" y2="${Y(t)}" stroke="${C.rule}"/><text class="ax" x="${m.l-10}" y="${Y(t)+4}" text-anchor="end">${o.fy?o.fy(t):t}</text>`; });
  (o.xticks||[]).forEach(t=>{ s+=`<text class="ax" x="${X(t)}" y="${m.t+ih+xty}" text-anchor="middle">${o.fx?o.fx(t):t}</text>`; });
  if(o.xlabel){ const xl=ph?o.xlabel.split(" · "):[o.xlabel]; xl.forEach((l,k)=>{ s+=`<text class="ax" x="${m.l+iw}" y="${m.t+ih+(ph?46+k*21:40)}" text-anchor="end">${l}</text>`; }); }
  (o.events||[]).forEach(e=>{ s+=`<line x1="${X(e.x)}" x2="${X(e.x)}" y1="${m.t-6}" y2="${m.t+ih}" stroke="${C.event}" stroke-width="1.5" stroke-dasharray="3 4"/><text class="ax" x="${X(e.x)}" y="${m.t-10}" text-anchor="middle" style="fill:${C.event};font-weight:500">${e.label}</text>`; });
  /* phones: the reference line's name is drawn after the data, outlined, so a line never runs through it */
  const hlText=o.hline?`<text class="axl" x="${m.l+8}" y="${Y(o.hline.y)-8}" fill="${C.ink2}"${onL?` paint-order="stroke" stroke="#F5F3EE" stroke-width="6" stroke-linejoin="round"`:""}>${o.hline.label}</text>`:"";
  if(o.hline) s+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(o.hline.y)}" y2="${Y(o.hline.y)}" stroke="${C.ink2}" stroke-dasharray="5 5"/>${onL?"":hlText}`;
  (o.bands||[]).forEach(b=>{
    const pts = b.hi.map(p=>`${X(p[0])},${Y(p[1])}`).concat(b.lo.slice().reverse().map(p=>`${X(p[0])},${Y(p[1])}`));
    s+=`<polygon points="${pts.join(" ")}" fill="${b.color}" opacity="${b.op||.35}"/>`;
  });
  if(o.vline!=null) s+= S.theme==="study" ? `<line x1="${X(o.vline)}" x2="${X(o.vline)}" y1="${m.t}" y2="${m.t+ih}" stroke="${C.muted}" stroke-width="1" stroke-dasharray="2 4"/>` : `<line x1="${X(o.vline)}" x2="${X(o.vline)}" y1="${m.t}" y2="${m.t+ih}" stroke="${C.loud}" stroke-width="1.5" opacity=".7"/>`;
  const labels=[];
  (o.series||[]).forEach(se=>{
    const pts = se.pts.filter(p=>p[1]!=null && (!o.log || p[1]>0));
    if(!pts.length) return;
    s+=`<polyline points="${pts.map(p=>`${X(p[0])},${Y(p[1])}`).join(" ")}" fill="none" stroke="${se.color}" stroke-width="${se.w||2.5}" stroke-linejoin="round" stroke-linecap="round" opacity="${se.op||1}"/>`;
    const last = pts[pts.length-1];
    if(se.label) labels.push(onL?{x:X(last[0]), pts:pts.map(p=>[X(p[0]),Y(p[1])]), color:se.color, text:se.label}:{x:X(last[0])+10, y:Y(last[1])+5+(se.dy||0), color:se.color, text:se.label});
    if(se.dot) s+=`<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="5" fill="${se.color}"/>`;
  });
  /* end-of-line labels: push apart so two lines ending close together stay readable */
  if(onL){ const CW=ph?9.6:7.6, LG=ph?22:18;
    /* phones: each name sits just above the end of its line, right-aligned; when two lines end close together the lower name goes under its line */
    /* the name clears every point of its own line under it (about 9.6 units per character at 16px mono) */
    /* try above its own line, then under it, then above every line; keep the first spot that touches no line and no other name */
    const yIn=(pts,x0,x1)=>{ const out=[]; for(let i=1;i<pts.length;i++){ const [ax,ay]=pts[i-1],[bx,by]=pts[i]; for(let t=0;t<=1;t+=.1){ const x=ax+(bx-ax)*t; if(x>=x0&&x<=x1) out.push(ay+(by-ay)*t); } } if(pts.length===1&&pts[0][0]>=x0) out.push(pts[0][1]); return out; };
    const placed=[];
    labels.sort((a,b)=>a.pts[a.pts.length-1][1]-b.pts[b.pts.length-1][1]).forEach(l=>{
      const w=l.text.length*CW+6, x0=l.x-w, own=yIn(l.pts,x0,l.x), all=labels.flatMap(o=>yIn(o.pts,x0,l.x));
      const top=Math.min(...own), bot=Math.max(...own);
      const free=y=>y>=16&&y<=m.t+ih-4&&all.every(v=>v<y-17||v>y+6)&&placed.every(p=>Math.abs(p-y)>=LG);
      let y=[top-10,bot+24,Math.min(...all)-10,Math.min(...all)-32,Math.max(...all)+24].find(free), halo=false;
      /* no clean spot: sit above its own line with a page-coloured outline so a crossing line passes behind the name */
      if(y==null){ const want=top-10, ys=[]; for(let v=16; v<=m.t+ih-4; v+=2) ys.push(v);
        const near=(a,b)=>Math.abs(a-want)-Math.abs(b-want);
        /* any clear spot within about 90 units of the line's end, else the nearest spot clear of other names, outlined */
        y=ys.filter(v=>free(v)&&Math.abs(v-want)<=90).sort(near)[0];
        if(y==null){ halo=true; y=ys.filter(v=>placed.every(p=>Math.abs(p-v)>=LG)).sort(near)[0] ?? Math.max(16,want); } }
      placed.push(y);
      s+=`<text class="axl" x="${l.x}" y="${y}" fill="${l.color}" text-anchor="end"${halo?` paint-order="stroke" stroke="#F5F3EE" stroke-width="6" stroke-linejoin="round"`:""}>${esc(l.text)}</text>`; });
    s+=hlText;
  } else {
  labels.sort((a,b)=>a.y-b.y);
  const lg=18; for(let i=1;i<labels.length;i++) if(labels[i].y-labels[i-1].y<lg) labels[i].y=labels[i-1].y+lg;
  labels.forEach(l=>{ s+=`<text class="axl" x="${l.x}" y="${l.y}" fill="${l.color}">${esc(l.text)}</text>`; });
  }
  (o.marks||[]).forEach(k=>{ s+=`<circle cx="${X(k.x)}" cy="${Y(k.y)}" r="${k.r||5.5}" fill="${k.fill||C.ink}" stroke="${C.paper}" stroke-width="2"/>${k.label?`<text class="axl" x="${X(k.x)+(k.dx??10)}" y="${Y(k.y)+(k.dy??-10)}" fill="${k.fill||C.ink}" text-anchor="${k.anchor||"start"}">${esc(k.label)}</text>`:""}`; });
  /* hover columns: one per x value, each carrying the values of every labelled line at that x */
  const tipSeries=(o.series||[]).filter(se=>se.label||se.tip);
  if(tipSeries.length && o.tip!==false){
    const xsAll=[...new Set(tipSeries.flatMap(se=>se.pts.map(p=>p[0])))].sort((a,b)=>a-b);
    const fy=o.tipy||o.fy||(v=>v), hx=o.tipx||(o.fx?(x=>o.fx(x)):(x=>x));
    xsAll.forEach((x,k)=>{ const l=k?(X(xsAll[k-1])+X(x))/2:X(x)-(xsAll.length>1?(X(xsAll[1])-X(x))/2:8), r=k<xsAll.length-1?(X(x)+X(xsAll[k+1]))/2:X(x)+(xsAll.length>1?(X(x)-X(xsAll[k-1]))/2:8);
      const lines=tipSeries.map(se=>{ const pt=se.pts.find(p=>p[0]===x); return pt&&pt[1]!=null?`${se.tip||se.label}: ${fy(pt[1])}`:null; }).filter(Boolean);
      if(!lines.length) return;
      s+=`<rect class="hov" x="${Math.max(m.l,l)}" y="${m.t}" width="${Math.max(1,Math.min(m.l+iw,r)-Math.max(m.l,l))}" height="${ih}" data-tip="${esc(hx(x)+"\n"+lines.join("\n"))}"/>`; });
  }
  return s+"</svg>";
}

function seg(name, opts, cur){ return `<div class="seg">${opts.map(o=>`<button class="${o[0]===cur?"on":""}" data-${name}="${o[0]}">${o[1]}</button>`).join("")}</div>`; }
function control(label, inner){ return `<div class="control"><span class="lbl">${label}</span>${inner}</div>`; }
const catControl = (label="Category") => control(label, seg("cat",CATS.map(c=>[c,c]),S.cat));
const eraControl = () => control("Launched", seg("era",["before","between","after"].map(p=>[p,PERIOD[p]]),era()));

function timeTrack(key, months, mi, startIdx){
  const n=months.length-1-startIdx, pos=i=>(i-startIdx)/n*100;
  const ti=months.indexOf(D.meta.terra), di=months.indexOf(D.meta.dencun), per=periodOf(months[mi]);
  const parts=[["before",startIdx,ti],["between",ti,di],["after",di,months.length]];
  const bars=parts.map(([p,a,b])=>`<div class="${p===per?"on":""}" style="flex:${b-a} 0 0">${PERIOD[p]}</div>`).join("");
  const ev=[["Terra collapse",ti],["Dencun upgrade",di]].map(([l,i])=>`<span style="left:${pos(i)}%"><b>${l}</b><i>${monthLabel(months[i])}</i></span>`).join("");
  const yrs=months.map((m,i)=>[m,i]).filter(([m,i])=>i>=startIdx&&m.endsWith("-01")).map(([m,i])=>`<span style="left:${pos(i)}%">${m.slice(0,4)}</span>`).join("");
  return `<div class="track"><div class="head"><span class="lbl">Drag through time</span><span class="chipread">${monthLabel(months[mi])} · ${PERIOD[per]}</span></div>
    <div class="tr"><div class="tr-ev">${ev}</div><div class="tr-bar">${bars}</div><div class="tr-yr">${yrs}</div>
    <input type="range" min="${startIdx}" max="${months.length-1}" step="1" value="${mi}" data-range="${key}" aria-label="Month"></div></div>`;
}

/* ---------- header: one title, one call to action ---------- */
function header(){
  const bar=(l,c,r)=>`<header class="top"><div class="bar">${l}${c}${r}</div>${S.view==="book"?`<nav class="steps" aria-label="Pages">${pages().map((p,i)=>`<button class="${i===S.idx?"cur":S.read.includes(p)?"done":""}" data-jump="${i}" title="${PNAME[p]}" aria-label="Page ${i+1} of ${pages().length}: ${PNAME[p]}"></button>`).join("")}</nav>`:""}</header>`;
  if(S.view==="home") return bar(`<span class="brand">On-chain DApp research</span>`,`<span></span>`,`<span class="navgroup"><button class="navlink" data-go="qindex">The six questions</button><button class="navlink" data-go="about">About us</button></span>`);
  if(S.view==="about"||S.view==="method") return bar(`<button class="navlink" data-act="aboutback">← Back</button>`,`<span></span>`,`<span></span>`);
  if(S.view==="pick") return bar(`<button class="navlink" data-go="home">← Home</button>`,`<span class="lbl">Choose your DApp</span>`,`<span></span>`);
  if(S.view==="diag") return bar(`<button class="navlink" data-go="pick">← Back</button>`,`<span class="lbl">Diagnose my DApp</span>`,`<button class="navlink" data-go="home">Start over</button>`);
  if(S.view==="card") return bar(`<button class="navlink" data-act="reopen">← Back</button>`,`<span class="lbl">Your card</span>`,`<button class="navlink" data-go="home">Start over</button>`);
  const n=new Set(S.read.map(qOf)).size;
  return bar(`<button class="navlink" data-go="home">← Home</button>`,`<span class="lbl">${BOOKS[S.scen].time}</span>`,`<button class="pill" data-go="card">Get my card · ${n}</button>`);
}

/* ---------- a slide: the answer on the left, the evidence on the right ---------- */
const TOPIC = {q1:"Categories",q2:"Survival",q3:"Concentration",q4:"Growth",q5:"Retention",q6:"Take-off"};
const KIND = {q1:"Describe",q2:"Predict",q3:"Describe",q4:"Describe",q5:"Describe",q6:"Describe"};
const kindTag = q => `<span class="s-kind ${KIND[q].toLowerCase()}" data-tip="${KIND[q]==="Predict"?"What our model says separates DApps that last from those that fade":"What happened in the data"}">${KIND[q]}</span>`;
const ASK = {q1:"Which categories are growing or declining?", q2:"What separates apps that keep growing from those that fade?", q3:"How concentrated is activity among the biggest apps?", q4:"How quickly do successful apps gain users?", q5:"How many users stay after their first visit?", q6:"What happens to volume, wallets, gas and retention before an app takes off?"};
/* top-right filter bar: compact selects and sliders, so the charts sit right under the title */
/* filters live beside the title as small chips; each opens a panel on hover, focus or tap */
const fwrap=(label,body)=>`<div class="fl"><button type="button" class="fchip" aria-haspopup="true">${label}</button><div class="fpop">${body}</div></div>`;
function selectFilter(name,label,opts,cur){ return fwrap(label,`<span class="flbl">${label}</span><select data-sel="${name}" aria-label="${label}">${opts.map(o=>`<option value="${o[0]}"${o[0]===cur?" selected":""}>${o[1]}</option>`).join("")}</select>`); }
const catFilter=()=>selectFilter("cat","Category",CATS.map(c=>[c,c]),S.cat);
function rangeFilter(key,label,min,max,val,readout){ return fwrap(label,`<span class="flbl">${label}</span><input type="range" min="${min}" max="${max}" step="1" value="${val}" data-range="${key}" aria-label="${label}"><b>${readout}</b>`); }
function monthFilter(key, months, mi, startIdx){
  const n=months.length-1-startIdx, pos=i=>(i-startIdx)/n*100, ti=months.indexOf(D.meta.terra), di=months.indexOf(D.meta.dencun);

    caption = d.group ? `${esc(d.name)} follows the ${d.group==="grower"?"kept-growing":"one-hit"} shape, peaking at ${fmtN(d.peak)} wallets${norm.length>3?` in month ${peakM}`:""}.` : "Three months is too early to call your shape.";
  } else caption = `Across the market, most widely used DApps fade after an early peak.`;
  const shapes = chart({tipx:t=>t===0?"Launch month":`Month ${t}`,w:560,h:440,r:100,x:[0,23],y:[0,1],xticks:[0,6,12,18,23],fx:t=>t===0?"launch":t,yticks:[0,.5,1],fy:t=>pct(t),xlabel:"months after launch · share of each DApp's own peak",series,aria:"Median shape of the two groups"});
  const order=["Size","Stickiness","Context","Movement","Concentration"], W=D.q5.weights, ERAS=["before","between","after"];
  const top=order.slice().sort((a,b)=>W[e][b][0]-W[e][a][0])[0];
  const wfig = sBars(order.map(gr=>({label:gr,v:W[e][gr][0],hi:gr===top,tip:`${gr}, ${PERIOD[e]}\n${pct(W[e][gr][0])} of the model's weight\nrange ${pct(W[e][gr][1])} to ${pct(W[e][gr][2])}\n${ERAS.filter(p=>p!==e).map(p=>`${PERIOD[p]}: ${pct(W[p][gr][0])}`).join("\n")}`})),v=>pct(v),{aria:"Weight of each feature group"});
  const bq=q2.by_cat[S.cat], bqn=bq.flash+bq.grower;
  return {brief:`${S.scen==="s1"&&d&&d.group?`${esc(d.name)} follows the ${d.group==="grower"?"kept-growing":"one-hit"} shape`:bqn?`In ${S.cat}, ${bq.flash} of ${bqn} widely used DApps faded`:`${pct(f/n)} of widely used DApps faded`}; ${top.toLowerCase()} tells the two apart.`,
    head:`${pct(f/n)} of widely used DApps faded. ${K(top)} best tells the two apart.`,
    filters:[S.theme!=="study" && S.scen==="s2" && catFilter(), S.theme!=="study" && selectFilter("era","Launched",ERAS.map(p=>[p,PERIOD[p]]),e)], caption,
    fig:`<div class="duo">${panel(`Two shapes · all ${n} widely used DApps`,shapes)}${panel(`What separates them · launched ${PERIOD_IN[e]}`,wfig)}</div>`,
    read:(()=>{ if(S.scen==="s1" && d){ const nm=d.norm&&d.norm.length?d.norm:null; if(!nm) return `${esc(d.name)} has three months of data so far; its shape is drawn against the market.`;
      const pk=nm.indexOf(Math.max(...nm.filter(v=>v!=null))), lastv=nm.filter(v=>v!=null).slice(-1)[0];
      return (()=>{ const lastm=nm.length-1-[...nm].reverse().findIndex(v=>v!=null);
      return `${pk===lastm?`${esc(d.name)} is still at its peak in month ${lastm}: it has not faded.`:`${esc(d.name)} peaked in month ${pk} and by month ${lastm} held ${pct(lastv)} of that peak.`} The typical grower holds ${pct(q2.median.grower[23])} of its peak by month 23; the typical one-hit DApp ${pct(q2.median.flash[23])}.`; })(); }
    const b=q2.by_cat[S.cat], bn=b.flash+b.grower; return bn ? `In ${S.cat}, ${b.flash} of ${bn} widely used DApps faded and ${b.grower} kept growing, against ${pct(f/n)} faded across the market.` : `No ${S.cat} DApp has reached 1K wallets with a year of history yet.`; })(),
    define:true,
    careful:`For DApps launched ${PERIOD_IN[e]}, ${top.toLowerCase()} carries ${pct(W[e][top][0])} of the model's weight${top==='Size'?'':` and size ${pct(W[e].Size[0])}`}. The model sees only each DApp's early months.`};
}

    series:[{pts:xs.map(i=>[i,ss[i]]),color:C.q1,w:3,label:"Successful"},{pts:xs.map(i=>[i,so[i]]),color:C.q2,w:3,label:"Others"}],
    marks:[{x:m,y:ss[m],fill:C.loud,label:pct(ss[m]),dx:-10,anchor:"end"},{x:m,y:so[m],fill:C.loud,label:pct(so[m]),dx:-10,anchor:"end"}],aria:"Share that reached 10K wallets"});

    filters:[rangeFilter("q4m","Age",0,12,m,`${m}: ${pct(ss[m])} vs ${pct(so[m])}`)],

        return `${esc(d.name)} had ${fmtN(v)} wallets by month ${mm}, ${v>=med?"above":"below"} the successful median of ${fmtN(med)}.`; }
      const gap=xs.map(i=>ss[i]-so[i]), gm=gap.indexOf(Math.max(...gap));

function pQ1(){
  const q=D.q1, months=q.months, first=months.findIndex((m,i)=>CATS.some(c=>q.growth_12m[c][i]!=null));
  const mi=Math.max(first, S.q1m ?? months.length-1), mo=months[mi];
  const d=me(), cat = S.scen==="s1" && d ? d.cat : S.cat;
  const total=months.map((m,i)=>CATS.reduce((a,c)=>a+(q.wallets[c][i]||0),0));
  const xs=months.map((m,i)=>i).filter(i=>i>=first-12);
  const ti=months.indexOf(D.meta.terra), di=months.indexOf(D.meta.dencun);
  const overview = chart({tipx:i=>monthLabel(months[i]),w:560,h:440,r:100,x:[xs[0],months.length-1],y:[0,Math.max(...total)*1.08],xticks:xs.filter(i=>months[i].endsWith("-01")),fx:i=>"’"+months[i].slice(2,4),yticks:[0,Math.max(...total)/2,Math.max(...total)],fy:fmtN,vline:mi,
    events:[{x:ti,label:"Terra"},{x:di,label:"Dencun"}],series:[{pts:xs.map(i=>[i,total[i]]),color:C.ref,w:2.5,tip:"All categories"}],marks:[{x:mi,y:total[mi],fill:C.loud,label:fmtN(total[mi]),dx:-10,anchor:"end"}],xlabel:"monthly active wallets, all categories",aria:"Total active wallets"});
  const rows=CATS.map(c=>({c,g:q.growth_12m[c][mi],w:q.wallets[c][mi],n:q.dapps[c][mi]})).filter(r=>r.g!=null).sort((a,b)=>b.g-a.g);
  const grew=rows.filter(r=>r.g>0), lead=rows[0], mine=rows.find(r=>r.c===cat); S.q1lead=lead&&lead.g>0?{c:lead.c,g:lead.g}:null;
  const RH=372/Math.max(rows.length,1); const lim=Math.max(.5,...rows.map(r=>Math.min(Math.abs(r.g),2))), W=560, cx=350, sc=v=>Math.max(-1,Math.min(1,v/lim))*180;
  let s=`<svg viewBox="0 0 ${W} 440" preserveAspectRatio="xMinYMid meet" role="img" aria-label="12-month change by category"><line x1="${cx}" x2="${cx}" y1="24" y2="396" stroke="${C.ink2}"/>`;
  rows.forEach((r,i)=>{ const y=24+i*RH+RH/2-11, w=sc(r.g), on=r.c===cat, fill=on?C.loud:r.g>=0?C.q1:C.q2;
    s+=`<g class="hovrow" data-tip="${esc(`${r.c}, ${monthLabel(mo)}\n${sgn(r.g)} on a year earlier\n${fmtN(r.w)} active wallets\n${r.n} active DApp${r.n===1?"":"s"}`)}"><rect class="hovbg" x="0" y="${y-6}" width="${W}" height="${RH}" /><text class="axl" x="0" y="${y+15}" fill="${on?C.loud:C.ink}">${r.c}</text>
      <rect x="${w<0?cx+w:cx}" y="${y+2}" width="${Math.max(3,Math.abs(w))}" height="18" rx="9" fill="${fill}"/>
      <text class="axl" x="${w<0?cx+w-8:cx+w+8}" y="${y+16}" text-anchor="${w<0?"end":"start"}" fill="${on?C.loud:C.ink2}">${sgn(r.g)}${Math.abs(r.g)>lim?" ›":""}</text></g>`; });
  s+=`<text class="ax" x="${cx-10}" y="416" text-anchor="end">← shrinking</text><text class="ax" x="${cx+10}" y="416">growing →</text><text class="ax" x="460" y="436" text-anchor="end">active wallets vs a year earlier</text></svg>`;
  return {brief: mine ? `${cat} had ${fmtN(mine.w)} active wallets in ${monthLabel(mo)}, ${sgn(mine.g)} on a year earlier.` : `${grew.length} of ${rows.length} categories grew over the year to ${monthLabel(mo)}.`,
    head: grew.length ? `In ${monthLabel(mo)}, ${K(`${grew.length} of ${rows.length}`)} categories grew over the year.` : `In ${monthLabel(mo)}, ${K("none")} of the ${rows.length} categories grew over the year.`,
    filters:[S.theme!=="study" && S.scen==="s2" && catFilter(), S.theme!=="study" && monthFilter("q1m", months, mi, first)],
    caption: `${mine?`${cat} changed ${sgn(mine.g)}. `:""}${grew.length?`${lead.c} led at ${sgn(lead.g)}.`:""}`,
    fig:`<div class="duo">${panel("The whole market",overview)}${panel(`By category, ${monthLabel(mo)}`,S.theme==="study"?sBars(rows.map(r=>({label:r.c,v:r.g,hi:r.c===cat,tip:`${r.c}, ${monthLabel(mo)}\n${sgn(r.g)} on a year earlier\n${fmtN(r.w)} active wallets\n${r.n} active DApp${r.n===1?"":"s"}`})),v=>sgn(v),{aria:"12-month change by category"}):s)}</div>`,
    read:(()=>{ const pm=mi-12, tp=pm>=0?total[pm]:null; return mine ? `In ${monthLabel(mo)}, ${cat} had ${fmtN(mine.w)} active wallets across ${mine.n} DApp${mine.n===1?"":"s"}, ${sgn(mine.g)} on a year earlier. The whole market had ${fmtN(total[mi])}${tp?` (${sgn(total[mi]/tp-1)})`:""}.` : `No ${cat} data for ${monthLabel(mo)}.`; })(),
    careful:(()=>{ const rk=rows.findIndex(r=>r.c===cat)+1, ev=[[D.meta.terra,"the Terra collapse"],[D.meta.dencun,"the Dencun upgrade"]].filter(([m])=>m>months[Math.max(0,mi-12)] && m<=mo).map(x=>x[1]);
      if(mine && mine.n<5) return `${cat} has only ${mine.n} active DApp${mine.n===1?"":"s"} this month, so a single app can swing the number.`;
      return `${cat} ranks ${rk} of ${rows.length} categories this month.${ev.length?` This 12-month window includes ${ev.join(" and ")}.`:""}`; })()};
}

  ["Uniswap V3","Beanstalk"].forEach(nm=>{ const k=Object.keys(D.dapps).find(k=>D.dapps[k].name===nm); if(!k) return;

  Object.assign(S,keep); return WALL_EX; }
function wallCards(){ const T=wallToday(), seen=new Set(T.map(c=>c.n)); return wallExamples().filter(c=>!seen.has(c.n)).concat(T); }
/* how many cards a tank shows at once (newest first), so a busy day never slows the page: Home 4 on phones / 6 on desktop, the booth page 8 / 12 */

const ETH_MARK=`<svg class="bc-eth" viewBox="0 0 20 32" aria-hidden="true"><path d="M10 1 L19 16 L10 21.5 L1 16 Z M10 1 V21.5 M1 16 L10 11.5 L19 16 M1 18.5 L10 31 L19 18.5 L10 24 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>`;

    ${topToday(10,true)}</div></div></main>`; }
let tankRAF=0;
function tankStart(){ cancelAnimationFrame(tankRAF); const tank=document.getElementById("tank"); if(!tank) return;
  const els=[...tank.querySelectorAll(".tk-card")]; if(!els.length) return;
  const TW=tank.clientWidth, TH=tank.clientHeight;
  const B=els.map((el,i)=>{ const w=el.offsetWidth, h=el.offsetHeight, a=Math.random()*Math.PI*2, sp=CALM()?0:(.18+Math.random()*.22);
    const C=Math.max(1,Math.min(els.length,Math.round(TW/(w*1.05)))), R=Math.ceil(els.length/C), cw=TW/C, rh=TH/R;
    return {el,w,h,x:Math.min(TW-w,Math.max(0,(i%C)*cw+(cw-w)/2+(Math.random()-.5)*10)),y:Math.min(TH-h,Math.max(0,Math.floor(i/C)*rh+(rh-h)/2+(Math.random()-.5)*10)),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:(Math.random()-.5)*8,vr:(Math.random()-.5)*.02}; });
  let vis=true; if("IntersectionObserver" in window){ const io=new IntersectionObserver(es=>{ vis=es[0].isIntersecting; }); io.observe(tank); }
  const step=()=>{ if(!document.body.contains(tank)) return;
    if(!vis||document.hidden){ tankRAF=requestAnimationFrame(step); return; }
    B.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.r+=b.vr;
      if(b.x<0){b.x=0;b.vx=Math.abs(b.vx);} if(b.x>TW-b.w){b.x=TW-b.w;b.vx=-Math.abs(b.vx);}
      if(b.y<0){b.y=0;b.vy=Math.abs(b.vy);} if(b.y>TH-b.h){b.y=TH-b.h;b.vy=-Math.abs(b.vy);}
      if(Math.abs(b.r)>6) b.vr=-b.vr;
      b.el.style.transform=`translate(${b.x}px,${b.y}px) rotate(${b.r}deg)`; });
    if(!CALM()) tankRAF=requestAnimationFrame(step); };
  step(); }

/* ---------- diagnose: compare with every DApp at the same age ----------
   features: size (log wallets), how far below its own peak, change on last month, share of new wallets,
   top-10 wallet share. Each is z-scored across the DApps of that age, so size cannot drown out shape. */
const DFEAT=[["size",1],["toPeak",1],["mom",.8],["newShare",.6],["whale",.5]];
function featAt(w,prev,peak,ns,wh){ const L=x=>Math.log10((x||0)+1);
  return {size:L(w), toPeak:peak!=null?L(w)-L(Math.max(peak,w)):null, mom:prev!=null?L(w)-L(prev):null, newShare:ns, whale:wh}; }
function snapFeat(d,m){ const w=d.w[m]; if(w==null||w<=0) return null; const before=d.w.slice(0,m+1).filter(v=>v!=null);
  return featAt(w, m>0?d.w[m-1]:null, Math.max(...before), d.ns[m], d.wh[m]); }
function diagnose(u){
  const m=u.age; let pool=Object.entries(D.snap).map(([slug,d])=>({slug,d,f:snapFeat(d,m)})).filter(x=>x.f);
  const same=pool.filter(x=>x.d.c===u.cat), usedCat=same.length>=8; if(usedCat) pool=same;
  const used=DFEAT.filter(([k])=>u.f[k]!=null);
  const st={}; used.forEach(([k])=>{ const v=pool.map(x=>x.f[k]).filter(v=>v!=null), mu=v.reduce((a,b)=>a+b,0)/v.length, sd=Math.sqrt(v.reduce((a,b)=>a+(b-mu)**2,0)/v.length)||1; st[k]=[mu,sd]; });
  pool.forEach(x=>{ let t=0, wsum=0; used.forEach(([k,wt])=>{ if(x.f[k]==null) return; t+=wt*((x.f[k]-u.f[k])/st[k][1])**2; wsum+=wt; }); x.dist=wsum?Math.sqrt(t/wsum):Infinity; });
  pool.sort((a,b)=>a.dist-b.dist);
  const near=pool.slice(0,20).map(x=>{ const w=x.d.w[m], later=x.d.w[Math.min(m+12,x.d.w.length-1)], r=later!=null?later/w:null;
    return {...x, ratio:r, fate:r==null?"unknown":r>=1?"grew":r>=.5?"held":"faded"}; });
  const tally={grew:0,held:0,faded:0,unknown:0}; near.forEach(x=>tally[x.fate]++);
  return {age:m, near, tally, usedCat, cat:u.cat, n:pool.length, used:used.map(x=>x[0])};
}
/* =====================================================================
   The study: the baseline. Six plain questions, each answered by one part of the research,
   with one era switch that recomputes every answer. Market questions (Q1, Q3) use the era as a
   calendar window; cohort questions (Q2, Q4, Q5, Q6) use the DApps launched in that era.
   ===================================================================== */
const SERAS=[
  {k:"before", name:"Before Terra", span:"2020 – Apr 2022", note:"DeFi summer, 2021 bull market", from:"2020-01", to:"2022-04"},
  {k:"between",name:"Terra → Dencun",span:"May 2022 – Feb 2024", note:"Terra and FTX collapse", from:"2022-05", to:"2024-02"},
  {k:"after",  name:"After Dencun", span:"Mar 2024 – Dec 2025", note:"Dencun upgrade, cheaper layer-2 fees", from:"2024-03", to:"2025-12"}];
const SQ=[
  {q:"q1", tag:"Categories", kind:"Describe", ask:"Which categories are growing or declining?"},
  {q:"q2", tag:"Survival", kind:"Predict",  ask:"What separates apps that keep growing from those that fade?"},
  {q:"q3", tag:"Concentration", kind:"Describe", ask:"How concentrated is activity among the biggest apps?"},
  {q:"q4", tag:"Speed", kind:"Describe", ask:"How quickly do successful apps gain users?"},
  {q:"q5", tag:"Retention", kind:"Describe", ask:"How many users stay after their first visit?"},
  {q:"q6", tag:"Take-off", kind:"Describe", ask:"What happens to volume, wallets, gas and retention before an app takes off?"}];
const SC={ink:"#1A1A1A", rust:"#9C4A26", grey:"#A39E95", soft:"#D9D4CA", rule:"#E2DDD4"};
const sera=()=>SERAS.find(x=>x.k===(S.sera||"after"));
const med=a=>{ const v=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y); if(!v.length) return null; const h=v.length/2; return v.length%2?v[Math.floor(h)]:(v[h-1]+v[h])/2; };
const inEra=(lm,e)=>lm && lm>=e.from && lm<=e.to;

/* horizontal bars, diverging around zero when any value is negative */
function sBars(rows, fmt, opt={}){
  const ph=PHONE(), W=ph?560:980, lw=ph?150:170, rw=Math.max(ph?64:70, Math.max(...rows.map(r=>String(fmt(r.v)).length))*(ph?10.2:8)+14) /* room for the longest value label */, H=ph?440:380, cut=ph?14:20, RH=(H-30)/rows.length, neg=rows.some(r=>r.v<0);
  const vmax=Math.max(...rows.map(r=>Math.abs(r.v)),1e-9), span=W-lw-rw;
  const x0=neg? lw+span*(Math.abs(Math.min(...rows.map(r=>r.v),0))/(Math.abs(Math.min(...rows.map(r=>r.v),0))+Math.max(...rows.map(r=>r.v),0)||1)) : lw;
  const sc=v=>v/vmax*(neg? Math.max(x0-lw, lw+span-x0) : span);
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet" role="img" aria-label="${esc(opt.aria||"bars")}">`;
  [0.25,0.5,0.75,1].forEach(t=>{ if(!neg) s+=`<line x1="${lw+span*t}" x2="${lw+span*t}" y1="0" y2="${rows.length*RH}" stroke="${SC.rule}"/>`; });
  s+=`<line x1="${x0}" x2="${x0}" y1="0" y2="${rows.length*RH}" stroke="${SC.grey}"/>`;
  rows.forEach((r,i)=>{ const y=i*RH+RH/2, w=sc(r.v), col=r.hi?"#3860BE":(r.v<0?SC.grey:SC.ink);
    s+=`<g class="hovrow" data-tip="${esc(r.tip||`${r.label}\n${fmt(r.v)}`)}"><rect class="hovbg" x="0" y="${i*RH}" width="${W}" height="${RH}"/>
      <text class="sax" x="${lw-12}" y="${y+4}" text-anchor="end">${esc(r.label.length>cut?r.label.slice(0,cut-1)+"…":r.label)}</text>
      <rect x="${w<0?x0+w:x0}" y="${y-6}" width="${Math.max(2,Math.abs(w))}" height="12" fill="${col}"/>
      <text class="sax" x="${w<0?x0+8:x0+w+8}" y="${y+4}" text-anchor="start">${fmt(r.v)}</text></g>`; });
  return s+"</svg>";
}

/* each question for one era: the plain answer, its figure, and its sample */

    if(done) return `<circle cx="${x}" cy="${y}" r="5" fill="${d.s?"#9C4A26":"#FBFAF7"}" stroke="${d.s?"#9C4A26":"#8E8A82"}" stroke-width="1.2" data-tip="${tip}"/>`;
    return `<circle class="g-cand" cx="${x}" cy="${y}" r="5.5" fill="#6F6B64" data-tip="${tip}"/>`; }).join("");
  const board=GLEVELS.map((L,i)=>`<li class="${i===G.lv?"cur":""}"><span class="s-mono">L<span class="lv-w">evel </span>${i+1}</span><span>${L.short}</span><b>${i<G.lv||i===G.lv&&G.phase!=="intro"?`${hits(G.picks[i])*gWorth(i)}`:"–"}</b>${i===G.lv&&G.phase!=="done"?`<i class="g-lvtime" id="g-time-m">${fmtTime(gElapsed())}</i>`:""}</li>`).join("");
