      <button class="s-cardbtn g-donego" data-act="${over?"gend":"gnext"}">${over?"See my score →":"Next level →"}</button></div>`:`<div class="g-taskbar"><span class="s-mono">Your task</span>
      <p class="g-task">Pick three dark dots, reading <b>${A.label.toLowerCase()}</b> and <b>${B.label.toLowerCase()}</b> together.</p>
</div>`;
  let fin="";
  /* the finish card sits over the map, like "Your turn" at the start */
  if(G.phase==="done"){ side=""; fin=`<div class="g-finhead"><span class="s-mono">Finished</span><button class="g-replay" data-act="gmenu" aria-label="Play again" title="Play again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/><path d="M20 4v5h-5" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><h3>${gPts(G)} points in ${fmtTime(G.el)}</h3><p>${total} of ${MPICKS*GLEVELS.length} picks were a success.</p>
      ${G.id?"":`<label class="g-name"><span class="s-mono">Your name for the board</span><span class="g-namebox"><input id="g-name" maxlength="14" placeholder="e.g. Ana" autocomplete="off"><button class="g-namego" data-act="gsave" aria-label="Save my score">→</button></span></label>`}
      ${G.id?(()=>{ const today=lbSort(lbLoad().filter(r=>r.at===lbDay())), i=today.findIndex(r=>r.id===G.id);
        return `<p class="g-rankline">${i>=0?`You are <b class="o-you">#${i+1}</b> of ${today.length} today${i<3?", on the podium on Home":""}.`:"Saved."}</p><button class="fold-more g-seetop" data-go="wall"><span>See today's top scores</span><i>›</i></button>`; })():""}
`; }
  /* while playing: no separate time/score box; the level tiles carry the clock and the points */
  if(G.phase!=="done") side=`<div class="m-side g-playside">
      <div class="g-act">${done?(over?`<button class="s-cardbtn" data-act="gend">See my score →</button>`:`<button class="s-cardbtn" data-act="gnext">Next level →</button>`):""}</div>
      <div class="g-cards">${[0,1,2].map(i=>picks[i]?gPickCard(find(picks[i]),G,i):`<div class="g-card g-empty"><span class="g-num">${i+1}</span><span class="g-name">Pick ${i+1}: click a dark dot</span></div>`).join("")}</div>
</div>`;
  return `<main class="study s-wrap g-page">
    <div class="g-titlerow"><h1 class="s-qtitle">${lv.title}</h1><button class="g-quit" data-act="gmenu" aria-label="Quit the game" title="Quit the game"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="#CF4500" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
    ${taskbar}<ol class="g-levels">${board}</ol>
    <div class="m-wrap g-${G.phase}"><figure class="s-fig m-fig"><figcaption class="g-cap s-mono">${lv.short} · ${pool.length} DApps</figcaption><svg id="mapsvg" class="m-svg game ${G.phase}" viewBox="0 0 ${MAPW} ${MAPH}" role="img" aria-label="Level map">${mapAxes()}${dots}</svg>${G.phase==="intro"?`<div class="g-over"><b>Your turn</b><span>X · ${A.label} &nbsp;×&nbsp; Y · ${B.label}</span><p class="g-rule">Go with your gut.</p><button class="s-cardbtn g-go" data-act="gplay">Let\'s go →</button></div>`:""}${fin?`<div class="g-over g-fin">${fin}</div>`:""}<div class="s-note m-notes"><p><span class="s-mono">How to read</span><span><i class="m-key" style="background:#6F6B64"></i>This level <span class="g-num g-num-s">1</span>Your pick <i class="m-key" style="background:#9C4A26"></i>Success <i class="m-key" style="background:#FBFAF7;border:1px solid #1A1A1A"></i>Not a success <i class="m-key" style="background:#CFC9BF;opacity:.5"></i>Other levels</span></p></div></figure>
      ${side}</div>
    <section class="t-learn"><h2>${G.mode==="learn"?"This level's two measures":"The two measures"}</h2><div class="t-cards">${termCard(G.ax[0],"X")}${termCard(G.ax[1],"Y")}</div></section></main>`;
}
setInterval(()=>{ ["g-time","g-time-m"].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=fmtTime(gElapsed()); }); },250);
/* a game left alone stops itself: one minute with no tap, click or key, or ten minutes of play in all, sends the screen back to the game's start, unsaved and without a message */
let gLastInput=Date.now();
["pointerdown","keydown","wheel","touchstart"].forEach(ev=>addEventListener(ev,()=>{ gLastInput=Date.now(); },{passive:true,capture:true}));
setInterval(()=>{ const G=S.gm; if(S.view!=="game"||!G||G.phase==="menu"||G.phase==="done") return;
  /* also stops once a game has run for ten minutes in all */
  if(Date.now()-gLastInput>=60000||gElapsed()>=600000){ S.gm=null; document.querySelectorAll(".i-sheet").forEach(e=>e.remove()); document.body.classList.remove("sheet-open"); render(); window.scrollTo(0,0); } },1000);
/* =====================================================================
   The two scenario walks. Not the six questions again: each step's answer picks what the next step
   looks at, so the visitor digs down instead of reading six separate facts.
     Market (s2): a moment → who is hot → who runs that category → what the leaders share → do users stay
     My DApp (s1): its category → its rivals → the gap to the leaders → do its users stay
   ===================================================================== */
const STEP={
  w0:{short:"Moment", ask:"Pick a moment in the market.", kind:"Describe"},
  w1:{short:"Hot or fading", ask:"Who's hot, and who's fading?", kind:"Describe"},
  w2:{short:"Leaders", ask:"Who runs it?", kind:"Describe"},
  w3:{short:"What they share", ask:"What do the leaders have in common?", kind:"Predict"},
  w4:{short:"Retention", ask:"Do their users stay?", kind:"Describe"},
  v1:{short:"Category", ask:"Is its category hot or fading?", kind:"Describe"},
  v2:{short:"Rivals", ask:"Who are its rivals?", kind:"Describe"},
  v3:{short:"The gap", ask:"How does it compare with the leaders?", kind:"Predict"},
  v4:{short:"Retention", ask:"Will its users stay?", kind:"Describe"}};
Object.entries(STEP).forEach(([k,v])=>{ ASK[k]=v.ask; QNAME[k]=v.short; PNAME[k]=v.short; KIND[k]=v.kind; });
BOOKS.s1.pages=["v1","v2","v3","v4"]; BOOKS.s2.pages=["w0","w1","w2","w3","w4"];
BOOKS.s1.time="Your DApp, dug down"; BOOKS.s2.time="The market, dug down";

const ERAWIN={before:["2020-01","2022-04"],between:["2022-05","2024-02"],after:["2024-03","2025-12"]};
function eraCats(e){
  const M=D.q1.months, [f,t]=ERAWIN[e], a=M.indexOf(f), b=M.indexOf(t);
  return CATS.map(c=>{ const W=D.q1.wallets[c], s0=W.slice(a,a+3).filter(v=>v!=null), s1=W.slice(b-2,b+1).filter(v=>v!=null);
    const m0=s0.reduce((x,y)=>x+y,0)/(s0.length||1), m1=s1.reduce((x,y)=>x+y,0)/(s1.length||1);
    return {c, v:m0>0?m1/m0-1:null, w0:m0, w1:m1}; }).filter(r=>r.v!=null&&r.w0>=1000).sort((x,y)=>y.v-x.v);
}
const chg=v=>v==null?"–":v>=1?`×${(1+v).toFixed(v>=9?0:1)}`:sgn(v);
const leadOf=(e,c)=>(D.lead[e]||{})[c]||null;
const FEATS=[["ret","Returning share",v=>pct(v),"Stickiness"],["txpw","Transactions per wallet",v=>v>=10?Math.round(v)+"":v.toFixed(1),"Stickiness"],
  ["wal","Active wallets",v=>fmtN(v),"Size"],["whale","Whale share",v=>pct(v),"Concentration"]];
function featOf(slug){ const d=D.snap[slug]; if(!d) return null; const w=d.w&&d.w[2];
  return {ret:d.ns&&d.ns[2]!=null?1-d.ns[2]:null, wal:w||null, txpw:d.t&&w?d.t[2]/w:null, whale:d.wh?d.wh[2]:null}; }
function featMed(slugs){ const F=slugs.map(featOf).filter(Boolean), o={}; FEATS.forEach(([k])=>o[k]=med(F.map(f=>f[k]))); o.n=F.length; return o; }
const catSlugs=c=>Object.entries(D.snap).filter(([k,d])=>d.c===c).map(([k])=>k);

/* a row per measure, one thin bar per group, each row scaled to its own largest value */
function compareFig(groups){
  const ph=PHONE(), W=ph?560:980, lw=ph?150:200, rw=ph?76:90, RH=28*groups.length+34, H=FEATS.length*RH+10, span=W-lw-rw, cut=n=>ph&&n.length>14?n.slice(0,13)+"…":n;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Early signals compared">`;
  FEATS.forEach(([k,label,fmt],r)=>{ const y0=r*RH+6, vals=groups.map(g=>g.v[k]), mx=Math.max(...vals.filter(v=>v!=null),1e-9);
    s+=`<text class="axl" x="0" y="${y0+14}" fill="#1A1A1A">${label}</text><line x1="0" x2="${W}" y1="${y0+RH-4}" y2="${y0+RH-4}" stroke="#ECE8E1"/>`;
    groups.forEach((g,i)=>{ const v=g.v[k], y=y0+26+i*28, w=v==null?0:Math.max(2,v/mx*span);
      s+=`<g class="hovrow" data-tip="${esc(`${label}\n${g.name}: ${v==null?"no data":fmt(v)}`)}"><rect class="hovbg" x="${lw}" y="${y-4}" width="${span+rw}" height="26"/>
        <text class="ax" x="${lw-12}" y="${y+12}" text-anchor="end">${esc(cut(g.name))}</text>
        ${v==null?`<text class="ax" x="${lw}" y="${y+12}">no data</text>`:`<rect x="${lw}" y="${y+4}" width="${w}" height="10" fill="${g.col}"/><text class="ax" x="${lw+w+8}" y="${y+13}" style="fill:#1A1A1A">${fmt(v)}</text>`}</g>`; }); });
  return s+"</svg>";
}
function retFig(e, extra){
  const Pd=D.q5.periods[e], xs=D.q5.months;
  return chart({tipx:t=>t===0?"Launch month":`Month ${t}`,w:980,h:380,r:150,x:[0,6],y:[0,1],xticks:xs,fx:t=>t===0?"launch":`M${t}`,yticks:[0,.25,.5,.75,1],fy:t=>pct(t),xlabel:"months after launch · first users still active",
    bands:[{lo:xs.map(i=>[i,Pd.lo[i]]),hi:xs.map(i=>[i,Pd.hi[i]]),color:"#E2DDD4",op:.7}],
    series:[{pts:xs.map(i=>[i,Pd.median[i]]),color:"#1A1A1A",w:2.5,label:`Typical · ${pct(Pd.median[6])}`,tip:`Typical DApp launched ${PERIOD_IN[e]}`},...(extra||[])],aria:"First users still active"});
}

/* ---------- the market walk ---------- */
function wEra(){ const e=era(); return e; }
function pW0(){
  const e=wEra(), M=D.q1.months, tot=i=>CATS.reduce((s,c)=>s+(D.q1.wallets[c][i]||0),0);
  const cards=SERAS.map(x=>{ const r=eraCats(x.k), [f,t]=ERAWIN[x.k], a=M.indexOf(f), b=M.indexOf(t), ch=tot(b)/Math.max(1,tot(a))-1, on=x.k===e;
    /* the era's whole market, month by month: a small picture of what happened inside it */
    const ys=[]; for(let i=a;i<=b;i++) ys.push(tot(i)); const mx=Math.max(...ys,1), W=240, H=64, px=i=>i/(ys.length-1)*W, py=v=>H-4-v/mx*(H-10);
    const line=ys.map((v,i)=>`${i?"L":"M"}${px(i).toFixed(1)} ${py(v).toFixed(1)}`).join(" ");
    const spark=`<svg class="w-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${line} L${W} ${H} L0 ${H}Z" fill="${on?"#E8E2DA":"#EFEBE5"}"/><path d="${line}" fill="none" stroke="${on?"#141413":"#A39E95"}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
    return `<button class="w-era ${on?"on":""}" data-pera="${x.k}" aria-pressed="${on}" aria-label="${on?"Selected":"Choose"}: ${x.name}"><div class="w-art"><span class="s-mono">${x.span}</span><div class="ax-wrap w-chart"><span class="ax-y ax-top">${fmtN(mx)}</span><span class="ax-y ax-bot">0</span>${spark}</div><div class="ax-x w-axx"><span>${monthLabel(M[a])}</span><span>monthly wallets</span><span>${monthLabel(M[b])}</span></div></div><b>${x.name}</b><p>${x.note}</p>
      <div class="w-big"><strong>${chg(ch)}</strong><span>market wallets, first vs last 3 months</span></div>
      <div class="w-hot"><span class="s-mono">Hottest</span><span>${r[0]?r[0].c:"–"}</span></div></button>`; }).join("");
  return {head:`Every era told a different story. You are looking at ${K(PERIOD[e])}.`, read:"Pick one: the next steps only look at what happened inside it.",
    fig:`<div class="w-eras w-eras2">${cards}</div><p class="w-cap">Market wallets: the first three months of each era against its last three.</p>`, bare:true,
    brief:`${PERIOD[e]}: ${SERAS.find(x=>x.k===e).note}.`, say:PERIOD_IN[e][0].toUpperCase()+PERIOD_IN[e].slice(1), path:["Moment",PERIOD[e]]};
}
function pW1(){
  const e=wEra(), rows=eraCats(e); if(!S.catPicked && rows[0]) S.cat=rows[0].c;
  const top=rows[0], bot=rows[rows.length-1], me_=rows.find(r=>r.c===S.cat)||top;
  const fig=sBars(rows.map(r=>({label:r.c,v:r.v,hi:r.c===S.cat,tip:`${r.c}, ${PERIOD[e]}\n${chg(r.v)} across the era\n${fmtN(r.w0)} → ${fmtN(r.w1)} monthly wallets`})),v=>chg(v),{aria:"Change by category"});
  const chips=`<div class="w-pickrow w-pickup"><p><span class="s-mono">Next steps follow</span> <b>${S.cat}</b>${S.cat===top.c?", the hottest this era.":"."}</p>
    <details class="w-more"${S.wopen==="cat"?" open":""}><summary>Follow another category</summary><div class="w-menu">${rows.map(r=>`<button class="${r.c===S.cat?"on":""}" data-follow="${r.c}"><span>${r.c}</span><em>${chg(r.v)}</em></button>`).join("")}</div></details></div>`;
  return {head:`${PERIOD_IN[e].charAt(0).toUpperCase()+PERIOD_IN[e].slice(1)}, ${K(top.c)} was the hottest (${chg(top.v)}); ${bot.c} ${bot.v<0?"faded the most":"grew the least"} (${chg(bot.v)}).`,
    fig, pick:chips, how:"Change in monthly active wallets, first three months of the era against the last three.",
    src:`Category activity · n = ${rows.length} categories, monthly active wallets.`, careful:rows.length<CATS.length?`${CATS.length-rows.length} small categories are hidden: too few wallets at the start to measure change.`:"",
    brief:`${S.cat} ${me_.v>=0?"grew":"shrank"} ${chg(me_.v)} ${PERIOD_IN[e]}.`, say:`${S.cat} ${me_.v>=0?`grew ${chg(me_.v).replace(/^\+/,"")}`:`shrank ${pct(-me_.v)}`}`, path:["Hot or fading",`Wallets ${chg(me_.v)} in the era`]};
}
function pW2(){
  const e=wEra(), L=leadOf(e,S.cat);
  if(!L) return {head:`No ${S.cat} DApps were active ${PERIOD_IN[e]}.`, fig:"", brief:"No leaders.", path:["Leaders","–"]};
  if(!L.top.some(t=>t[0]===S.leader)) S.leader=L.top[0][0];
  const t5=L.top.reduce((s,t)=>s+t[3],0), lead=L.top.find(t=>t[0]===S.leader);
  const fig=sBars(L.top.map(t=>({label:t[1].length>18?t[1].slice(0,17)+"…":t[1],v:t[3],hi:t[0]===S.leader,tip:`${t[1]}\n${pct(t[3],1)} of ${S.cat} wallets\n${fmtN(t[2])} monthly wallets on average`})),v=>pct(v),{aria:"Share of the category's wallets"});
  const chips=`<div class="w-pickrow w-pickup"><p><span class="s-mono">Next steps follow</span> <b>${esc(lead[1])}</b>${S.leader===L.top[0][0]?", the leader.":"."}</p>
    <details class="w-more"><summary>Follow another leader</summary><div class="w-menu">${L.top.map(t=>`<button class="${t[0]===S.leader?"on":""}" data-leader="${t[0]}"><span>${esc(t[1])}</span><em>${pct(t[3])}</em></button>`).join("")}</div></details></div>`;
  return {head:`${K(esc(L.top[0][1]))} holds ${pct(L.top[0][3])} of ${S.cat}'s wallets ${PERIOD_IN[e]}; the top 5 hold ${pct(t5)}.`,
    fig, pick:chips, how:"Each bar is one DApp's share of the category's monthly active wallets, averaged over the era.",
    src:`Leaders · n = ${L.n} ${S.cat} DApps active in the era.`, careful:t5>.8?`The top 5 hold most of ${S.cat}: a newcomer competes with a few giants.`:`${S.cat} is spread out: beyond the top 5 there is still ${pct(1-t5)} to win.`,
    brief:`${esc(L.top[0][1])} leads ${S.cat} with ${pct(L.top[0][3])}; the top 5 hold ${pct(t5)}.`, say:`${esc(lead[1])} led it with ${pct(lead[3])} of its wallets`, path:["Leader",`${esc(lead[1])}, ${pct(lead[3])} of ${S.cat} wallets`]};
}
function watchOf(e){ const Wt=D.q5.weights[e], top=Object.keys(Wt).sort((a,b)=>Wt[b][0]-Wt[a][0])[0]; return {top, w:Wt[top][0]}; }
function pW3(){
  const e=wEra(), L=leadOf(e,S.cat), ld=L?L.top.map(t=>t[0]):[], LM=featMed(ld), TM=featMed(catSlugs(S.cat)), w=watchOf(e);
  const fk=(FEATS.find(f=>f[3]===w.top)||FEATS[0]);
  const fig=compareFig([{name:`${S.cat} top 5`,col:"#1A1A1A",v:LM},{name:`Typical ${S.cat}`,col:"#A39E95",v:TM}]);
  const lv=LM[fk[0]], tv=TM[fk[0]];
  return {head:`The model's strongest signal ${PERIOD_IN[e]} is ${K(w.top.toLowerCase())} (${pct(w.w)} of its weight).`,
    read:lv!=null&&tv!=null?`In their third month, ${S.cat}'s top 5 had ${fk[2](lv)} (${fk[1].toLowerCase()}), against ${fk[2](tv)} for a typical ${S.cat} DApp.`:`Not enough early data on ${S.cat}'s leaders.`,
    fig, define:true, how:`Median of each group in its third month. Black: ${S.cat}'s top 5. Grey: every ${S.cat} DApp we can measure. Each row is scaled to its own largest value.`,
    src:`Model weights · n = ${LM.n} leaders and ${TM.n} ${S.cat} DApps with early data.`,
    careful:lv!=null&&tv!=null&&lv<tv?`Here the leaders were below typical on ${fk[1].toLowerCase()}: in ${S.cat}, being early and big mattered more than what the model weighs most across all DApps.`:"Leaders that launched before 2020 have no early months in our data, so they drop out of the black bars.",
    brief:`Watch ${w.top.toLowerCase()}: ${fk[1].toLowerCase()} ${lv!=null?fk[2](lv):"–"} for leaders vs ${tv!=null?fk[2](tv):"–"} typical.`, say:lv!=null&&tv!=null?`its leaders differed most on ${fk[1].toLowerCase()} (${fk[2](lv)} vs ${fk[2](tv)} typical)`:`its leaders differed most on ${fk[1].toLowerCase()}`, path:["Watch",`${w.top}, ${pct(w.w)} of the model's weight`]};
}
function pW4(){
  const e=wEra(), Pd=D.q5.periods[e], ld=D.dapps[S.leader], extra=[];
  if(ld&&ld.ret) extra.push({pts:ld.ret.map((v,i)=>[i,v]),color:"#3860BE",w:2.5,label:`${ld.name.length>14?ld.name.slice(0,13)+"…":ld.name} · ${pct(ld.ret[6])}`,tip:ld.name,dot:true});
  return {head:`Six months on, DApps launched ${PERIOD_IN[e]} keep about ${K(pct(Pd.median[6]))} of their first users.`,
    read:ld&&ld.ret?`${esc(ld.name)} kept ${pct(ld.ret[6])}: ${ld.ret[6]>=Pd.median[6]?"above":"below"} the typical DApp.`:`We have no launch-cohort retention for the leader you followed, so only the typical curve is shown.`,
    fig:`<div class="draw-once">${retFig(e,extra)}</div>`, how:"Black: the typical DApp launched in this era, with the middle half shaded. Blue: the leader you followed, if we have its launch cohort.",
    src:`Retention · n = ${Pd.n} DApps with 100+ wallets in their first month.`, careful:`Most of the drop happens in the first month: only ${pct(Pd.median[1])} are left after one month.`,
    brief:`Typical retention after six months: ${pct(Pd.median[6])}${ld&&ld.ret?`; ${esc(ld.name)} ${pct(ld.ret[6])}`:""}.`, say:ld&&ld.ret?`${esc(ld.name)} kept ${pct(ld.ret[6])} of its first users after six months (typical ${pct(Pd.median[6])})`:`the typical DApp kept ${pct(Pd.median[6])} of its first users after six months`, path:["Retention",`${pct(ld&&ld.ret?ld.ret[6]:Pd.median[6])} of first users at month 6`]};
}

Object.assign(PAGES,{w0:pW0,w1:pW1,w2:pW2,w3:pW3,w4:pW4});
/* ---------- the my-DApp walk: one DApp looking outward ----------

/* lookalikes: nearest DApps in its third month, on wallets (log) and returning share */
function lookalikes(slug,k=20){

  const all=Object.keys(D.snap).filter(s=>s!==slug&&D.snap[s].s!=null).map(s=>({s,p:pt(s)})).filter(x=>x.p);
  return {me:me0, all, near:all.map(x=>({...x,d:Math.hypot(x.p.u-me0.u,x.p.v-me0.v)})).sort((a,b)=>a.d-b.d).slice(0,k)};

  if(t.id==="cq"){ S.cquery=t.value; const pos=t.selectionStart; render(); const n=$("#cq"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } return; }
  if(t.id==="q"){ S.query=t.value; const pos=t.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(t.classList && t.classList.contains("digits")){ const clean=t.value.replace(/\D/g,"").slice(0,9); const er=$("#f-err"); if(clean!==t.value){ t.value=clean; if(er) er.textContent="Numbers only: letters and symbols are ignored."; } else if(er) er.textContent=""; return; }
  if(t.id && t.id.startsWith("f-")){ const er=$("#f-err"); if(er) er.textContent=""; return; }
  const r=t.dataset.range; if(!r) return;
  if(r==="eraIdx"){ S.era=["before","between","after"][+t.value]; }
  else if(r==="q3k"){ const yr=D.q3.months[S.q3m??D.q3.months.length-1].slice(0,4); S.q3k=D.q3.rank_curve[yr].k[+t.value]; }
  else if(r==="q1m"||r==="q3m"){ S.q1m=S.q3m=+t.value; }
  else S[r]=+t.value;
  const y=window.scrollY; render(); window.scrollTo(0,y);
  const n=document.querySelector(`[data-range="${r}"]`); if(n) n.focus();
});
/* floating tooltip for any element with data-tip (charts, bars); tap also works on touch screens */
(function(){ const tip=document.createElement("div"); tip.id="tip"; tip.setAttribute("role","tooltip"); document.body.appendChild(tip);
  const show=(el,x,y)=>{ const t=el.getAttribute("data-tip"); if(!t) return; const [h,...rest]=t.split("\n");
    tip.innerHTML=`<b>${esc(h)}</b>${rest.map(l=>`<span>${esc(l)}</span>`).join("")}`; tip.classList.add("on"); place(x,y); };
  /* beside the pointer, flipped when it would run off an edge, and always kept fully on screen (phones are narrow) */
  const place=(x,y)=>{ const r=tip.getBoundingClientRect(); let L=x+16, T=y+16; if(L+r.width>innerWidth-8) L=x-r.width-16; if(T+r.height>innerHeight-8) T=y-r.height-16;
    L=Math.max(8,Math.min(L,innerWidth-r.width-8)); T=Math.max(8,Math.min(T,innerHeight-r.height-8)); tip.style.left=L+"px"; tip.style.top=T+"px"; };
  document.addEventListener("mousemove",e=>{ const el=e.target.closest&&e.target.closest("[data-tip]"); if(el) show(el,e.clientX,e.clientY); else tip.classList.remove("on"); });
  document.addEventListener("click",e=>{ const el=e.target.closest&&e.target.closest("[data-tip]"); if(el){ show(el,e.clientX,e.clientY); clearTimeout(tip._t); tip._t=setTimeout(()=>tip.classList.remove("on"),2500); } });
  window.addEventListener("scroll",()=>tip.classList.remove("on"),{passive:true});
})();

document.addEventListener("keydown",e=>{ if(e.key!=="Escape") return; document.body.classList.remove("menu-open"); if(document.querySelector(".i-sheet")){ document.querySelectorAll(".i-sheet").forEach(x=>x.remove()); document.body.classList.remove("sheet-open"); } if(S.csheet){ S.csheet=null; const y=window.scrollY; render(); window.scrollTo(0,y); } });
document.addEventListener("scroll",e=>{ const s=e.target; if(!s.classList||!s.classList.contains("srt")) return; const i=Math.round(s.scrollLeft/s.clientWidth); const dots=s.nextElementSibling; if(dots) [...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i)); },true);
/* desktop More ways in: the dot follows the first card in view */
document.addEventListener("scroll",e=>{ const w=e.target; if(!w.classList||!w.classList.contains("m-top")) return; const cs=getComputedStyle(w), v=cs.flexDirection==="column", kids=[...w.querySelectorAll(".m-sum,.m-card")], wr=w.getBoundingClientRect(), L=v?wr.top+parseFloat(cs.paddingTop||0):wr.left+parseFloat(cs.paddingLeft||0);
  let i=kids.findIndex(c=>{ const r=c.getBoundingClientRect(); return (v?r.top:r.left)>=L-8; }); if((v?w.scrollTop:w.scrollLeft)>4&&(v?w.scrollTop>=w.scrollHeight-w.clientHeight-4:w.scrollLeft>=w.scrollWidth-w.clientWidth-4)) i=kids.length-1; document.querySelectorAll(".m-topdots button").forEach((b,k)=>b.classList.toggle("on",k===Math.max(0,i))); },true);
document.addEventListener("scroll",e=>{ const w=e.target; if(!w.classList||!w.classList.contains("h-more")) return; const kids=[...w.children], x=w.scrollLeft;
  let i=kids.findIndex(c=>c.offsetLeft-w.offsetLeft>=x-8); if(x>=w.scrollWidth-w.clientWidth-4) i=kids.length-1; document.querySelectorAll(".h-moredots button").forEach((b,k)=>b.classList.toggle("on",k===Math.max(0,i))); },true);

/* booth screen: open with ?kiosk (or ?kiosk=120 for seconds) and the site goes back to a fresh Home after that long with no input.
   A reload clears every choice but keeps the game's top-10 board, which lives in localStorage. */
(function(){ const q=new URLSearchParams(location.search); if(!q.has("kiosk")) return;
  const secs=Math.max(15,+q.get("kiosk")||90); let t;
  const arm=()=>{ clearTimeout(t); t=setTimeout(()=>{ if(S.view==="home"&&!location.hash) return arm(); location.replace(location.pathname+location.search); },secs*1000); };
  ["pointerdown","pointermove","keydown","wheel","touchstart","scroll"].forEach(ev=>addEventListener(ev,arm,{passive:true}));
  arm(); })();
